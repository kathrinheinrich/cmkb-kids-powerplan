.hero{font-size:clamp(90px,24vw,150px);line-height:1;text-align:center;margin:8px 0 12px}
.tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (min-width:720px){.tiers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tier{border:3px solid var(--line);border-radius:30px;background:var(--bg);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:1.2rem}
.tier .e{font-size:clamp(76px,20vw,120px);line-height:1.1;display:flex;align-items:center;justify-content:center;min-height:1.1em}
.big{text-align:center;padding:12px 0}
.big .e{font-size:min(56vw,260px);line-height:1;display:flex;justify-content:center}
.big .nm{font-size:2.4rem;font-weight:700;margin:8px 0 24px}
.stack{display:flex;flex-direction:column;gap:14px;max-width:420px;margin:0 auto}
.item{display:flex;align-items:center;gap:14px;border:3px solid var(--line);border-radius:22px;padding:14px 16px;margin:0 0 14px}
.item .e{font-size:2.2rem;line-height:1;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block}
.del{border:3px solid var(--line);background:var(--bg);border-radius:50%;width:52px;height:52px;flex:none;font-size:1.2rem}
.badge{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;font-size:1.7rem;flex:none;color:#fff}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvl button{border:3px solid var(--line);background:var(--bg);border-radius:22px;padding:10px 4px;font-weight:700;display:flex;flex-direction:column;align-items:center}
.lvl button .ico{font-size:2.4rem}
.lvl button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.unit{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 0;border-bottom:2px solid var(--soft)}
.unit:last-child{border-bottom:0}
.unit .ul{flex:1 1 180px;font-weight:700}
.daybox{display:flex;align-items:center;gap:6px}
.daybox span{min-width:100px;text-align:center;font-weight:700}
.okbtn{border:3px solid var(--line);background:var(--bg);border-radius:999px;min-height:54px;padding:0 16px;font-weight:700}
.okbtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.gridwrap{overflow-x:auto;border:3px solid var(--line);border-radius:18px}
.wk{display:grid;grid-template-columns:52px repeat(7,minmax(100px,1fr));min-width:780px}
.wh{font-weight:700;text-align:center;padding:8px 2px;border-bottom:3px solid var(--line);font-size:1rem;min-height:70px}
.wh.today{background:var(--power);color:var(--onpower)}
.wh .ex{display:block;font-size:.85rem;background:var(--ink);color:var(--bg);border-radius:999px;margin:4px 2px 0;padding:0 6px}
.tcol,.dcol{position:relative;border-right:2px solid var(--soft)}
.tcol span{position:absolute;right:6px;font-size:.8rem;color:var(--muted);transform:translateY(-50%)}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--soft)}
.blk{position:absolute;left:3px;right:3px;border-radius:10px;font-size:.8rem;line-height:1.2;padding:2px 6px;overflow:hidden;font-weight:700;text-align:left;border:0}
.blk.fx{background:var(--soft);color:var(--ink)}
.blk.hb{background:var(--power);color:var(--onpower)}
.blk.un{color:#fff;cursor:pointer}
.blk.rv{color:#fff;cursor:pointer;outline:3px dashed rgba(255,255,255,.85);outline-offset:-4px}
.bedline{position:absolute;left:0;right:0;border-top:3px dashed var(--muted);font-size:.75rem;color:var(--muted);padding-left:4px}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.wknav b{font-size:1.2rem;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--bg);border:3px solid var(--line);border-radius:26px;padding:22px;max-width:460px;width:100%}
.steplist{list-style:none;padding:0;margin:0}
.steplist li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:2px solid var(--soft)}
.steplist li:last-child{border-bottom:0}
.steplist .ico{font-size:2rem;flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:3px solid var(--line);display:flex;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.nav .sp{flex:1}
.priv{text-align:center;color:var(--muted);font-size:1rem;margin:24px 0 0}
table.cfg{width:100%;border-collapse:collapse}
table.cfg td,table.cfg th{padding:8px 4px;text-align:left;border-bottom:2px solid var(--soft)}
table.cfg input{width:86px}
details summary{cursor:pointer;font-weight:700;min-height:48px;display:flex;align-items:center}
@media (prefers-reduced-motion:no-preference){.big .e{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* v02 · Breite + Startseite */
main{max-width:1180px}
main.narrow{max-width:760px}
@media (min-width:900px){
 main.st-tag .card{display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
 main.st-tag .row:has(.five){grid-column:1/-1}
 main.st-frei,main.st-pruef,main.st-lern,main.st-kal,main.st-eltern{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;align-items:start}
 main.st-frei>:not(.item),main.st-pruef>:not(.item){grid-column:1/-1}
 main.st-lern>:not(.card),main.st-kal>:not(.card),main.st-eltern>:not(.card){grid-column:1/-1}
}
.land{text-align:center;padding-top:8px}
.land .brand{font-size:clamp(2.6rem,7vw,4.4rem);line-height:1.05;margin:0 0 10px;font-weight:700}
.land .sub{font-size:clamp(1.2rem,2.4vw,1.6rem);color:var(--muted);margin:0 auto 26px;max-width:32ch}
.zoo{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:clamp(2.6rem,6vw,4.2rem);line-height:1.1;margin:0 0 28px}
.zoo span{display:inline-flex;align-items:center}
.video{position:relative;width:100%;max-width:1060px;margin:0 auto 34px;aspect-ratio:16/9;border:4px dashed var(--line);border-radius:30px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.video .play{width:clamp(90px,14vw,150px);height:clamp(90px,14vw,150px);border-radius:50%;background:var(--power);color:var(--onpower);display:grid;place-items:center;font-size:clamp(2.6rem,6vw,4.4rem);border:4px solid var(--line)}
.video b{font-size:clamp(1.1rem,2.2vw,1.6rem)}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.way{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1060px;margin:0 auto 34px;padding:0;list-style:none}
@media (min-width:900px){.way{grid-template-columns:repeat(6,minmax(0,1fr))}}
.way li{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
.way .c{width:84px;height:84px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:2.4rem}
.land .cta{display:flex;flex-direction:column;align-items:center;gap:14px;margin:0 0 10px}
.land .cta .btn{font-size:1.4rem;min-height:72px;padding:12px 44px}
.me[role=button]{cursor:pointer;border-radius:999px;padding:2px 8px 2px 2px}

/* v03 · Zeiger-Uhr mit Regler */
.tp{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.tp svg{width:124px;height:124px;flex:none}
.tp .tpc{display:flex;flex-direction:column;gap:6px;min-width:250px;flex:1}
.tp .tpw{font-weight:700;font-size:1.15rem;line-height:1.25}
.tp .tpd{color:var(--muted);font-size:1rem;font-weight:400;margin-left:6px}
.tp .tps{display:flex;align-items:center;gap:8px}
.tp .tps button{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:var(--bg);font-size:1.5rem;font-weight:700;flex:none;line-height:1}
.tp input[type=range]{flex:1;min-width:120px;min-height:52px;accent-color:var(--ink);border:0;padding:0;background:transparent}
.five{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))!important;gap:14px 28px!important}
.five label{gap:6px}
main.st-tag .row{align-items:center}
main.st-tag .row .tp{flex:1 1 100%}
.tp .tpw{font-size:1.25rem}
.unit .tp{flex:1 1 360px}

/* v04 · Strandbild Freizeit */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#scene svg{width:100%;height:100%;display:block}
body.beach{background:#8ED8F8}
body.beach main{position:relative;z-index:1}
main.st-frei{max-width:980px;margin-top:clamp(150px,26vh,280px);margin-bottom:150px;background:var(--bg);border:4px solid var(--line);border-radius:32px;padding:28px 26px 10px}
#hero{animation:fly 18s linear infinite}
#hero .bob{animation:bob 1.6s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(-320px,330px)}to{transform:translate(1950px,250px)}}
@keyframes bob{from{transform:translateY(-10px)}to{transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){#hero{animation:none;transform:translate(820px,250px)}#hero .bob{animation:none}}
.hobtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:0 0 20px;grid-column:1/-1}
.hobtile{border:3px solid var(--line);border-radius:26px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:1.1rem;color:#102A43}
.hobtile .e{font-size:clamp(52px,7vw,72px);line-height:1.1}
.pick{font-size:1.4rem;font-weight:700;margin:6px 0 12px;grid-column:1/-1}

/* v05 · Startseiten-Bühne */
main.st-landing{max-width:none;padding:0 0 60px}
.landhero{position:relative;overflow:hidden;background:#8ED8F8;color:#102A43;padding:clamp(70px,11vh,130px) 20px clamp(170px,22vh,230px);text-align:center}
.landhero .decor{position:absolute;inset:0;pointer-events:none}
.landhero .decor svg{width:100%;height:100%;display:block}
.landhero .wave{position:absolute;left:0;right:0;bottom:-2px;height:90px;pointer-events:none}
.landhero .inner{position:relative;max-width:1100px;margin:0 auto}
.landhero h1{font-family:"Fredoka","Atkinson Hyperlegible",system-ui,sans-serif;margin:0;line-height:.95;font-weight:700;color:#102A43}
.landhero .k{display:block;font-size:clamp(1.8rem,5vw,3.6rem);font-weight:600;letter-spacing:.01em;margin:0 0 .15em}
.landhero .k .sd{display:inline-block;background:#FF5FA2;color:#FFFFFF;border:4px solid #102A43;border-radius:18px;padding:0 .3em;transform:rotate(-3deg);margin-left:.15em}
.landhero .pp{display:block;white-space:nowrap;font-size:clamp(2.8rem,13vw,9.5rem);letter-spacing:-.01em}
.landhero .pp .bolt{display:inline-block;color:#FFC93C;-webkit-text-stroke:4px #102A43;paint-order:stroke fill}
.landhero .sticker{display:inline-block;margin-top:clamp(18px,3vh,30px);background:#FFC93C;color:#1A1200;border:4px solid #102A43;border-radius:999px;padding:.25em 1em;font-family:"Fredoka","Atkinson Hyperlegible",sans-serif;font-weight:600;font-size:clamp(1.4rem,3.4vw,2.3rem);transform:rotate(2deg)}
.landhero .zoo{margin:clamp(34px,6vh,56px) 0 0;gap:10px 18px}
.landhero .zoo span{background:#FFFFFF;border:4px solid #102A43;border-radius:50%;width:clamp(78px,10vw,112px);height:clamp(78px,10vw,112px);justify-content:center;font-size:clamp(2.6rem,5.4vw,3.8rem)}
.landhero .zoo span svg{width:80%;height:auto}
.landhero #hero{animation-name:fly2;animation-duration:20s}
@keyframes fly2{from{transform:translate(-320px,700px)}to{transform:translate(1950px,670px)}}
@media (prefers-reduced-motion:reduce){.landhero #hero{animation:none;transform:translate(1250px,690px)}}
.landbody{max-width:1180px;margin:0 auto;padding:clamp(40px,7vh,80px) 20px 0;text-align:center}
.landbody .video{margin-bottom:clamp(50px,8vh,90px)}
.landbody .way{margin-bottom:clamp(50px,8vh,80px)}

/* v07 · Große Stationssymbole mit Namensschild */
.top{padding:12px 18px}
.dots{gap:14px}
.dot{width:72px;height:72px;font-size:2.3rem;border-width:4px}
.dot .st{top:-14px;right:-12px;font-size:1.4rem}
.me .t{font-size:3rem}
.me .n{font-size:1.3rem}
.adultbtn{min-height:60px;font-size:1.15rem;padding:0 18px}
.dot[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:1.05rem;font-weight:700;white-space:nowrap;padding:8px 14px;border-radius:14px;opacity:0;visibility:hidden;pointer-events:none;z-index:30}
.dot[data-tip]::before{content:"";position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom:6px solid var(--ink);opacity:0;visibility:hidden;z-index:30}
.dot[data-tip]:hover::after,.dot[data-tip]:hover::before,.dot[data-tip]:focus-visible::after,.dot[data-tip]:focus-visible::before{opacity:1;visibility:visible}
@media (max-width:900px){.dot{width:56px;height:56px;font-size:1.7rem}.dots{gap:8px}.me .t{font-size:2.4rem}}
@media (max-width:600px){.dot{width:42px;height:42px;font-size:1.25rem;border-width:3px}.dots{gap:5px}.dot .st{top:-11px;right:-9px;font-size:1rem}.me .t{font-size:2rem}.adultbtn{min-height:46px;padding:0 10px}.dot[data-tip]::after,.dot[data-tip]::before{display:none}}

/* v08 · Fächer-Kacheln */
.subjbox{grid-column:1/-1;margin:24px 0 20px}
.subjtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.subjtile{position:relative;border:3px solid var(--line);border-radius:24px;padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:1.15rem;color:#FFFFFF;min-height:130px;justify-content:center}
.subjtile .e{font-size:clamp(44px,5vw,58px);line-height:1.1}
.subjtile .x{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;border:2px solid #102A43;background:#FFFFFF;font-size:1rem;display:grid;place-items:center}
.subjtile.add{background:var(--bg);color:var(--ink);border-style:dashed;cursor:pointer;font:inherit;font-weight:700}

/* v09 · Sprechblase Powertiere */
.landhero .zoo span{position:relative;cursor:pointer;outline-offset:4px}
.zoo .bub{font-style:normal;display:block;position:absolute;bottom:calc(100% + 86px);left:50%;transform:translateX(-50%) scale(.6);transform-origin:50% 120%;width:max-content;max-width:min(500px,86vw);background:#FFFFFF;color:#102A43;border:5px solid #102A43;border-radius:44px;padding:18px 28px;font-family:"Fredoka","Atkinson Hyperlegible",sans-serif;font-weight:600;font-size:clamp(1.3rem,2.4vw,1.9rem);line-height:1.2;text-align:center;opacity:0;visibility:hidden;pointer-events:none;z-index:40;box-shadow:8px 8px 0 #FF5FA2}
.zoo .bub b{color:#D6246E;font-weight:700}
.landhero .zoo .bub svg{position:absolute;top:calc(100% - 4px);left:50%;transform:translateX(-50%);width:110px;height:92px}
.landhero .zoo span:hover .bub,.landhero .zoo span:focus .bub{opacity:1;visibility:visible;transform:translateX(-50%) scale(1)}
@media (prefers-reduced-motion:no-preference){.zoo .bub{transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .15s}}
@media (max-width:600px){
 .zoo span:nth-child(3n+1) .bub{left:-8px;transform:scale(.6);transform-origin:20% 120%}
 .zoo span:nth-child(3n) .bub{left:auto;right:-8px;transform:scale(.6);transform-origin:80% 120%}
 .landhero .zoo span:nth-child(3n+1):hover .bub,.landhero .zoo span:nth-child(3n+1):focus .bub,.landhero .zoo span:nth-child(3n):hover .bub,.landhero .zoo span:nth-child(3n):focus .bub{transform:scale(1)}
 .zoo span:nth-child(3n+1) .bub svg{left:30px;transform:none}
 .zoo span:nth-child(3n) .bub svg{left:auto;right:30px;transform:none}
}

/* v10 · So funktioniert's */
.howto{font-family:"Fredoka","Atkinson Hyperlegible",sans-serif;font-weight:700;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.05;color:var(--ink);margin:clamp(70px,12vh,130px) 0 clamp(40px,7vh,70px)}
.landbody .way .c{width:clamp(84px,9vw,120px);height:clamp(84px,9vw,120px);font-size:clamp(2.4rem,4vw,3.4rem);border-width:4px}
.landbody .way li{font-size:clamp(1.05rem,1.5vw,1.3rem)}
.landbody .way{margin-bottom:clamp(70px,12vh,120px)}

/* v11 · Schulschluss-Wochenleiste */
.five label.d5{border:3px solid var(--line);border-radius:22px;padding:0 10px 14px;overflow:hidden;gap:12px;align-items:stretch}
.dayhd{display:block;margin:0 -10px;background:var(--ink);color:var(--bg);text-align:center;font-size:1.4rem;font-weight:700;padding:10px 4px;letter-spacing:.01em}
.five .tp{flex-direction:column;align-items:center;gap:8px}
.five .tp svg{width:112px;height:112px}
.five .tp .tpc{min-width:0;width:100%;align-items:center}
.five .tp .tpw{text-align:center;font-size:1.08rem}
.five .tp .tpd{display:block;margin:2px 0 0}
.five .tp .tps{width:100%;gap:6px}
.five .tp .tps button{width:46px;height:46px;font-size:1.3rem}
.five .tp input[type=range]{min-width:0}
@media (min-width:900px){main.st-tag .five{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:14px!important}}
@media (max-width:899px){main.st-tag .five{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))!important}}

/* v12 · Powertier als erster Schritt */
.dot.tierdot{background:#FFE08A;color:#1A1200}
.dot.tierdot svg{width:78%;height:auto}
.dot.tierdot .re{position:absolute;bottom:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--bg);border:3px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.dots .sep{width:3px;align-self:stretch;background:var(--line);border-radius:3px;margin:6px 4px;opacity:.35}
@media (min-width:900px){.landbody .way{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media (max-width:600px){.top{padding:8px 8px;gap:6px}.dot{width:36px;height:36px;font-size:1.1rem}.dots{gap:4px}.dots .sep{margin:4px 1px}.me .t{font-size:1.5rem}.adultbtn{padding:0 6px;min-height:40px;font-size:1rem}.dots{margin:0 auto;min-width:0}.dot.tierdot .re{width:20px;height:20px;font-size:.6rem;bottom:-6px;right:-6px;border-width:2px}}

/* v13 · Für alle Tage gleich */
.sameall{margin-left:auto;min-height:52px;font-size:1.05rem}
.sameall[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}

/* v14 · Welle volle Breite */
.landhero .wave{width:100%}

/* v15 · Straße */
.road{max-width:1240px;margin:0 auto}
.road svg{width:100%;height:auto;display:block;overflow:visible}
.road .rm{display:none;margin-top:10px}
@media (max-width:700px){.road .rd{display:none}.road .rm{display:block;max-width:420px;margin:0 auto}}
.road text{font-family:"Fredoka","Atkinson Hyperlegible",sans-serif;font-weight:700;fill:#102A43}
.road .num circle{fill:#FFC93C;stroke:#102A43;stroke-width:5;transition:fill .3s}
.road .num.on circle{fill:#FF5FA2}
.road .num text{fill:#102A43;font-size:34px}
.road .num.on text{fill:#FFFFFF}
.road .car{cursor:pointer}
.redrive{margin:10px auto clamp(60px,10vh,110px);display:block}
.landbody .way{display:none}

/* v16 · Powertier-Bühne */
#fun{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#FFD23F}
#fun svg{position:absolute;left:50%;top:46%;width:max(180vw,180vh);height:max(180vw,180vh);transform:translate(-50%,-50%)}
#fun .rays{transform-origin:0 0}
@media (prefers-reduced-motion:no-preference){#fun .rays{animation:spin 90s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
body.tierfun main{position:relative;z-index:1}

<script>
/* ── Block 1 · Daten, Speicher, Hilfsfunktionen ───────────────── */
const KEY='pp-plan-v1';
const TIERS=[
 {id:'fuchs',e:'🦊',n:'Fuchs'},{id:'schildkroete',e:'🐢',n:'Schildkröte'},
 {id:'schnecke',e:'🐌',n:'Rennschnecke'},{id:'baer',e:'🐻',n:'Bär'},
 {id:'ozelot',e:'🐆',n:'Ozelot'},{id:'axolotl',e:null,n:'Axolotl'},
 {id:'pferd',e:'🐎',n:'Rennpferd'}];
const COLORS=['#1E5AA8','#B3261E','#1B7A3A','#6A3BA8','#A34E00','#00707A','#A8336E','#6B4E2E'];
const SUBJ_EMO=['➗','📐','📖','🔤','🇬🇧','🇫🇷','🇪🇸','🏛️','🌍','🧬','🧪','⚛️','💻','🎵','🎨','⛪','🧠','⚽'];
const HOB_EMO=['⚽','🏊','🎸','🎹','🩰','🥋','🎨','🐴','🏀','🚴','🎾','🤸','🎭','🎮','📖','🎤'];
const KINDS={ka:{e:'📝',n:'Klassenarbeit'},test:{e:'✏️',n:'Test'},ref:{e:'🎤',n:'Referat'}};
const LEVELS={leicht:{e:'😊',n:'leicht'},mittel:{e:'😐',n:'mittel'},schwer:{e:'😬',n:'schwer'}};
const ORDER=[1,2,3,4,5,6,0];
const DN={1:'Mo',2:'Di',3:'Mi',4:'Do',5:'Fr',6:'Sa',0:'So'};
const BY={0:'SU',1:'MO',2:'TU',3:'WE',4:'TH',5:'FR',6:'SA'};
const STATIONS=[{e:'🌅',n:'Mein Tag'},{e:'⚽',n:'Meine Freizeit'},{e:'📝',n:'Meine Prüfungen'},{e:'⚡',n:'Mein Lernplan'},{e:'🗓️',n:'Meine Woche'},{e:'📲',n:'Ab in den Kalender'}];
const STEPS=['start','tier','tag','frei','pruef','lern','woche','kal','eltern'];

function defaults(){return{
 nick:'',age:null,tier:null,step:0,prev:0,done:{},
 day:{wake:'06:45',leave:'07:30',end:{1:'13:00',2:'13:00',3:'13:00',4:'13:00',5:'13:00'},lunch:'13:30',hw:45,dinner:'18:30',bed:'21:00',
      weWake:'08:30',weLunch:'12:30',weDinner:'18:30',weBed:'21:30'},
 hobbies:[],
 subjects:[{id:'s1',n:'Mathe',e:'➗',c:COLORS[0]},{id:'s2',n:'Deutsch',e:'📖',c:COLORS[1]},{id:'s3',n:'Englisch',e:'🇬🇧',c:COLORS[3]},
           {id:'s4',n:'Bio',e:'🧬',c:COLORS[2]},{id:'s5',n:'Erdkunde',e:'🌍',c:COLORS[5]},{id:'s6',n:'Geschichte',e:'🏛️',c:COLORS[7]}],
 exams:[],units:[],
 cfg:{leicht:{n:2,d:4},mittel:{n:3,d:6},schwer:{n:5,d:8},unitLen:0,review:10,maxPerDay:2},
 ics:{name:'Mein Lernplan',school:true,hw:true,hob:true,exams:true,units:true}
};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r),d=defaults();return Object.assign(d,o,{day:Object.assign(d.day,o.day||{}),cfg:Object.assign(d.cfg,o.cfg||{}),ics:Object.assign(d.ics,o.ics||{})});}}catch(e){}return null;}
let S=load()||defaults();
const X={dayTab:'schule',pick:null,hobby:null,exam:null,subj:null,wk:0,edit:null,err:'',dl:false};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
(function urlPrefill(){try{const p=new URLSearchParams(location.search);if(p.get('nick')&&!S.nick)S.nick=p.get('nick').slice(0,30);const a=+p.get('age');if(a>=10&&a<=14&&!S.age)S.age=a;}catch(e){}})();

const pad=n=>String(n).padStart(2,'0');
const m=s=>{const [h,mi]=String(s||'0:0').split(':').map(Number);return h*60+(mi||0);};
const hm=t=>pad(Math.floor(t/60))+':'+pad(t%60);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>new Date(s+'T12:00:00');
const addDays=(d,k)=>{const x=new Date(d);x.setDate(x.getDate()+k);return x;};
const todayIso=()=>iso(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=s=>{const d=pd(s);return DN[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.';};
const subj=id=>S.subjects.find(x=>x.id===id)||{n:'Fach',e:'📚',c:COLORS[0]};
const unitLen=()=>S.cfg.unitLen||(S.age&&S.age<=11?20:25);
function axo(size){return '<svg viewBox="0 0 120 100" width="'+size+'" height="'+(size*0.83)+'" role="img" aria-label="Axolotl"><g stroke="#B0185A" stroke-width="5" stroke-linecap="round" fill="none"><path d="M24 40 L6 28"/><path d="M22 52 L2 52"/><path d="M24 64 L6 76"/><path d="M96 40 L114 28"/><path d="M98 52 L118 52"/><path d="M96 64 L114 76"/></g><g fill="#E94B8A"><circle cx="6" cy="28" r="6"/><circle cx="2" cy="52" r="6"/><circle cx="6" cy="76" r="6"/><circle cx="114" cy="28" r="6"/><circle cx="118" cy="52" r="6"/><circle cx="114" cy="76" r="6"/></g><ellipse cx="60" cy="54" rx="40" ry="34" fill="#F7A8C4" stroke="#B0185A" stroke-width="4"/><circle cx="44" cy="48" r="6" fill="#102A43"/><circle cx="76" cy="48" r="6" fill="#102A43"/><path d="M48 66 Q60 76 72 66" stroke="#102A43" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="36" cy="62" r="5" fill="#F27BA8"/><circle cx="84" cy="62" r="5" fill="#F27BA8"/></svg>';}
function tierFace(id,px){const t=TIERS.find(x=>x.id===id);if(!t)return '⚡';return t.e?t.e:axo(px);}
</script>

<script>
/* ── Block 2 · Lernlogik: freie Zeit finden, Einheiten vorschlagen ── */
function dayInfo(d){
 const dow=d.getDay(),D=S.day;
 if(dow>=1&&dow<=5){const end=m(D.end[dow]),ls=Math.max(m(D.lunch),end),le=ls+30,he=le+(+D.hw||0);
  return{school:true,leave:m(D.leave),end,lunch:[ls,le],hw:[le,he],dinner:[m(D.dinner),m(D.dinner)+30],bed:m(D.bed),from:he+15};}
 return{school:false,lunch:[m(D.weLunch),m(D.weLunch)+45],dinner:[m(D.weDinner),m(D.weDinner)+30],bed:m(D.weBed),from:m(D.weWake)+60};
}
function busy(d,skip){
 const I=dayInfo(d),b=[I.lunch,I.dinner];if(I.school)b.push(I.hw);
 S.hobbies.forEach(h=>{if(h.days.includes(d.getDay()))b.push([m(h.from)-15,m(h.to)+15]);});
 const ds=iso(d);S.units.forEach(u=>{if(u.date===ds&&u.id!==skip)b.push([m(u.time)-5,m(u.time)+u.len+5]);});
 return b;
}
function findSlot(d,len,skip){
 const I=dayInfo(d),b=busy(d,skip),end=I.bed-30;
 for(let t=Math.ceil(I.from/5)*5;t+len<=end;t+=5){if(b.every(x=>t+len<=x[0]||t>=x[1]))return t;}
 return null;
}
function eveBlocked(ds,exId){return S.exams.some(e=>e.id!==exId&&(e.date===ds||iso(addDays(pd(e.date),-1))===ds));}
function planExam(ex){
 S.units=S.units.filter(u=>u.exam!==ex.id||u.ok);
 const c=S.cfg[ex.level],len=unitLen(),E=pd(ex.date),T=pd(todayIso());
 const have=S.units.filter(u=>u.exam===ex.id&&u.kind==='unit').length;
 const days=[];for(let k=c.d;k>=2;k--){const d=addDays(E,-k);if(d>=T&&!eveBlocked(iso(d),ex.id))days.push(d);}
 const need=Math.max(0,c.n-have);let miss=0;
 for(let i=0;i<need;i++){
  if(!days.length){miss++;continue;}
  const pi=Math.min(days.length-1,Math.floor(i*days.length/need)),order=[pi];
  for(let o=1;o<days.length;o++){if(pi+o<days.length)order.push(pi+o);if(pi-o>=0)order.push(pi-o);}
  let placed=false;
  for(const j of order){const d=days[j],ds=iso(d);
   if(S.units.filter(u=>u.date===ds&&u.kind==='unit').length>=S.cfg.maxPerDay)continue;
   const t=findSlot(d,len);if(t!=null){S.units.push({id:uid(),exam:ex.id,kind:'unit',date:ds,time:hm(t),len,ok:false});placed=true;break;}}
  if(!placed)miss++;
 }
 const R=addDays(E,-1);
 if(R>=T&&!S.units.some(u=>u.exam===ex.id&&u.kind==='review')){const t=findSlot(R,S.cfg.review);if(t!=null)S.units.push({id:uid(),exam:ex.id,kind:'review',date:iso(R),time:hm(t),len:S.cfg.review,ok:false});}
 ex.miss=miss;ex.planned=true;
}
function planAll(force){
 const T=todayIso();
 [...S.exams].sort((a,b)=>a.date.localeCompare(b.date)).forEach(ex=>{if(ex.date>T&&(force||!ex.planned))planExam(ex);});
 save();
}
function unitsOf(exId){return S.units.filter(u=>u.exam===exId).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));}
function unitNo(u){return unitsOf(u.exam).filter(x=>x.kind==='unit').indexOf(u)+1;}
function moveUnit(u,k){
 const ex=S.exams.find(e=>e.id===u.exam);let d=addDays(pd(u.date),k);
 if(d<pd(todayIso())||!ex||iso(d)>=ex.date)return false;
 u.date=iso(d);const t=findSlot(d,u.len,u.id);if(t!=null)u.time=hm(t);u.ok=false;return true;
}
</script>

<script>
/* ── Block 3 · Kalenderdatei (.ics) und Sicherung ───────────────── */
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function buildICS(o){
 const now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CMKB//PowerPlan//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(o.name),'X-WR-TIMEZONE:Europe/Berlin',
 'BEGIN:VTIMEZONE','TZID:Europe/Berlin','BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT','BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','END:VTIMEZONE'];
 let i=0;const base=Date.now();
 const ev=a=>L.push('BEGIN:VEVENT','UID:pp-'+base+'-'+(i++)+'@powerplan','DTSTAMP:'+stamp,...a,'TRANSP:OPAQUE','END:VEVENT');
 const dt=(d,t)=>iso(d).replace(/-/g,'')+'T'+pad(Math.floor(t/60))+pad(t%60)+'00';
 const TZ=';TZID=Europe/Berlin:';
 const start=pd(o.start);
 const first=dows=>{const d=new Date(start);for(let k=0;k<7;k++){if(dows.includes(d.getDay()))return d;d.setDate(d.getDate()+1);}return d;};
 [1,2,3,4,5].forEach(w=>{const d=first([w]),I=dayInfo(d);
  if(o.school&&I.end>I.leave)ev(['DTSTART'+TZ+dt(d,I.leave),'DTEND'+TZ+dt(d,I.end),'RRULE:FREQ=WEEKLY;BYDAY='+BY[w],'SUMMARY:🏫 Schule']);
  if(o.hw&&I.hw[1]>I.hw[0])ev(['DTSTART'+TZ+dt(d,I.hw[0]),'DTEND'+TZ+dt(d,I.hw[1]),'RRULE:FREQ=WEEKLY;BYDAY='+BY[w],'SUMMARY:✏️ Hausaufgaben','DESCRIPTION:'+icsEsc('Danach 15 Minuten Pause.')]);
 });
 if(o.hob)S.hobbies.forEach(h=>{if(!h.days.length)return;const d=first(h.days);
  ev(['DTSTART'+TZ+dt(d,m(h.from)),'DTEND'+TZ+dt(d,m(h.to)),'RRULE:FREQ=WEEKLY;BYDAY='+ORDER.filter(x=>h.days.includes(x)).map(x=>BY[x]).join(','),'SUMMARY:'+icsEsc(h.e+' '+h.n)]);});
 const T=todayIso();
 if(o.exams)S.exams.filter(e=>e.date>=T).forEach(e=>{const s=subj(e.subj),k=KINDS[e.kind];
  ev(['DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+iso(addDays(pd(e.date),1)).replace(/-/g,''),'SUMMARY:'+icsEsc(k.e+' '+s.n+': '+k.n),'DESCRIPTION:'+icsEsc((e.topic?'Thema: '+e.topic+'. ':'')+'Du schaffst das!')]);});
 if(o.units)S.units.filter(u=>u.date>=T).forEach(u=>{const e=S.exams.find(x=>x.id===u.exam);if(!e)return;const s=subj(e.subj),d=pd(u.date),t=m(u.time);
  const title=u.kind==='review'?'🔁 '+s.n+' kurz wiederholen':'📚 '+unitNo(u)+'. '+s.n+'-Einheit';
  ev(['DTSTART'+TZ+dt(d,t),'DTEND'+TZ+dt(d,t+u.len),'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc((e.topic?'Thema: '+e.topic+'. ':'')+(u.kind==='review'?'Nur kurz drüberschauen. Dann gut schlafen.':'Danach 5 Minuten Pause.'))]);});
 L.push('END:VCALENDAR');
 return L.join('\r\n')+'\r\n';
}
function download(name,text,type){
 const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}
function nextMonday(){const d=new Date();const k=(8-d.getDay())%7;return iso(addDays(d,k===0?0:k));}
</script>

<script>
/* ── Block 4 · Bildschirme ─────────────────────────────────────── */
const $=id=>document.getElementById(id);
const pr=b=>b?'true':'false';
const tip=(e,t)=>'<p class="tip"><span class="ico" aria-hidden="true">'+e+'</span><span>'+t+'</span></p>';
function timeIn(bind,val,label){return '<input type="time" step="300" data-bind="'+bind+'" value="'+esc(val)+'" aria-label="'+esc(label)+'">';}

function header(){
 if(S.step<2){$('top').innerHTML='';return;}
 const dots=STATIONS.map((s,i)=>{const st=i+2;return '<button class="dot'+(S.step===st?' cur':'')+'" data-act="go" data-v="'+st+'" aria-label="Station '+(i+1)+': '+s.n+(S.done[st]?', geschafft':'')+'"'+(S.step===st?' aria-current="step"':'')+'><span aria-hidden="true">'+s.e+'</span>'+(S.done[st]?'<span class="st" aria-hidden="true">⭐</span>':'')+'</button>';}).join('');
 $('top').innerHTML='<header class="top"><div class="me"><span class="t" aria-hidden="true">'+tierFace(S.tier,40)+'</span><span class="n">'+esc(S.nick||'Hi!')+'</span></div><nav class="dots" aria-label="Stationen">'+dots+'</nav><button class="adultbtn" data-act="adult" aria-label="Für Erwachsene">👤<span class="l"> Erwachsene</span></button></header>';
}
function navBar(back,next,nextLabel){
 $('nav').innerHTML=(back||next)?'<div class="nav">'+(back?'<button class="btn" data-act="back">◀ Zurück</button>':'<span></span>')+'<span class="sp"></span>'+(next?'<button class="btn go" data-act="next">'+(nextLabel||'Weiter ▶')+'</button>':'')+'</div>':'';
}

const V={};
V.start=()=>{
 navBar(false,true,"Los geht's! ▶");
 return '<div class="hero" aria-hidden="true">⚡</div><h1>Hi! Hier baust du deinen PowerPlan.</h1><p class="lead">Mit Plan lernst du entspannter. Und du hast mehr Zeit für das, was du magst.</p>'
 +'<div class="card"><label class="field">Wie sollen wir dich nennen?<input type="text" maxlength="30" autocomplete="off" placeholder="Dein Spitzname" data-bind="S.nick" value="'+esc(S.nick)+'"></label>'
 +'<div class="field" role="group" aria-label="Wie alt bist du?">Wie alt bist du?<div class="chips">'+[10,11,12,13,14].map(a=>'<button class="chip" data-act="age" data-v="'+a+'" aria-pressed="'+pr(S.age===a)+'">'+a+'</button>').join('')+'</div></div>'
 +(X.err?'<p class="err" role="alert">'+X.err+'</p>':'')+'</div><p class="priv">🔒 Alles bleibt auf diesem Gerät. Dein Spitzname reicht.</p>';
};
V.tier=()=>{
 if(X.pick){navBar(false,false);const t=TIERS.find(x=>x.id===X.pick);
  return '<div class="big"><h1>Das ist dein Powertier!</h1><div class="e" aria-hidden="true">'+(t.e||axo(240))+'</div><div class="nm">'+t.n+'</div><div class="stack"><button class="btn power" data-act="tierok">Ja, das bin ich! ✓</button><button class="btn" data-act="tierno">Lieber ein anderes</button></div></div>';}
 navBar(true,false);
 return '<h1>Wähle dein Powertier!</h1><div class="tiers">'+TIERS.map(t=>'<button class="tier" data-act="pick" data-v="'+t.id+'"'+(S.tier===t.id?' aria-pressed="true"':'')+'><span class="e" aria-hidden="true">'+(t.e||axo(110))+'</span>'+t.n+'</button>').join('')+'</div>';
};
V.tag=()=>{
 navBar(true,true);const D=S.day,sch=X.dayTab==='schule';
 const r=(e,l,inner)=>'<div class="row"><span class="lab"><span class="ico" aria-hidden="true">'+e+'</span>'+l+'</span>'+inner+'</div>';
 let h='<h1>🌅 Mein Tag</h1><p class="lead">Wann passiert was? So findet dein Plan deine freie Zeit.</p>'
 +'<div class="seg" role="group" aria-label="Tage"><button data-act="daytab" data-v="schule" aria-pressed="'+pr(sch)+'">📚 Schultage</button><button data-act="daytab" data-v="we" aria-pressed="'+pr(!sch)+'">🌞 Wochenende</button></div><div class="card">';
 if(sch){
  h+=r('⏰','Aufstehen',timeIn('S.day.wake',D.wake,'Aufstehen'))+r('🎒','Los zur Schule',timeIn('S.day.leave',D.leave,'Los zur Schule'))
  +'<div class="row"><span class="lab"><span class="ico" aria-hidden="true">🔔</span>Schulschluss</span><div class="five">'+[1,2,3,4,5].map(w=>'<label>'+DN[w]+timeIn('S.day.end.'+w,D.end[w],'Schulschluss '+DN[w])+'</label>').join('')+'</div></div>'
  +r('🍽️','Mittagessen',timeIn('S.day.lunch',D.lunch,'Mittagessen'))
  +r('✏️','Hausaufgaben','<div class="chips">'+[30,45,60,90].map(x=>'<button class="chip" data-act="hw" data-v="'+x+'" aria-pressed="'+pr(+D.hw===x)+'">'+x+' Min</button>').join('')+'</div>')
  +r('🍝','Abendessen',timeIn('S.day.dinner',D.dinner,'Abendessen'))+r('🌙','Schlafenszeit',timeIn('S.day.bed',D.bed,'Schlafenszeit'));
 }else{
  h+=r('⏰','Aufstehen',timeIn('S.day.weWake',D.weWake,'Aufstehen am Wochenende'))+r('🍽️','Mittagessen',timeIn('S.day.weLunch',D.weLunch,'Mittagessen am Wochenende'))
  +r('🍝','Abendessen',timeIn('S.day.weDinner',D.weDinner,'Abendessen am Wochenende'))+r('🌙','Schlafenszeit',timeIn('S.day.weBed',D.weBed,'Schlafenszeit am Wochenende'));
 }
 return h+'</div>'+tip('💡','Power-Tipp: Wer seinen Tag kennt, findet leichter freie Zeit.');
};
V.frei=()=>{
 navBar(true,true);
 let h='<h1>⚽ Meine Freizeit</h1><p class="lead">Was machst du gern? Diese Zeiten bleiben frei.</p>';
 h+=S.hobbies.map(x=>'<div class="item"><span class="e" aria-hidden="true">'+x.e+'</span><span class="tx"><b>'+esc(x.n)+'</b>'+ORDER.filter(d=>x.days.includes(d)).map(d=>DN[d]).join(', ')+' · '+x.from+'–'+x.to+'</span><button class="del" data-act="delhob" data-v="'+x.id+'" aria-label="'+esc(x.n)+' löschen">🗑️</button></div>').join('');
 if(X.hobby){const f=X.hobby;
  h+='<div class="card"><h2>Neues Hobby</h2><div class="field">Bild<div class="chips">'+HOB_EMO.map(e=>'<button class="chip emo" data-act="hobemo" data-v="'+e+'" aria-pressed="'+pr(f.e===e)+'">'+e+'</button>').join('')+'</div></div>'
  +'<label class="field">Was machst du?<input type="text" maxlength="30" data-bind="X.hobby.n" value="'+esc(f.n)+'" placeholder="Fußball"></label>'
  +'<div class="field">An welchen Tagen?<div class="chips">'+ORDER.map(d=>'<button class="chip" data-act="hobday" data-v="'+d+'" aria-pressed="'+pr(f.days.includes(d))+'">'+DN[d]+'</button>').join('')+'</div></div>'
  +'<div class="field">Von wann bis wann?<div class="chips">'+timeIn('X.hobby.from',f.from,'Beginn')+timeIn('X.hobby.to',f.to,'Ende')+'</div></div>'
  +(X.err?'<p class="err" role="alert">'+X.err+'</p>':'')
  +'<div class="chips"><button class="btn go" data-act="savehob">Speichern ✓</button><button class="btn" data-act="cancel">Abbrechen</button></div></div>';
 }else h+='<button class="btn power wide" data-act="newhob">➕ Hobby eintragen</button>';
 return h+tip('🔋','Power-Tipp: Freizeit lädt deine Superkräfte wieder auf.');
};
V.pruef=()=>{
 navBar(true,true);const T=todayIso();
 let h='<h1>📝 Meine Prüfungen</h1><p class="lead">Was steht an? Trag alles ein, was du schon weißt.</p>';

  +(X.err?'<p class="err" role="alert">'+X.err+'</p>':'')

function unitRow(u){

V.lern=()=>{

V.woche=()=>{
 navBar(true,true);
 const t0=new Date();const mon=addDays(t0,-((t0.getDay()+6)%7)+7*X.wk);const days=[0,1,2,3,4,5,6].map(k=>addDays(mon,k));
 const D=S.day,H0=Math.floor(Math.min(m(D.leave),m(D.weWake))/60),H1=Math.min(24,Math.ceil((Math.max(m(D.bed),m(D.weBed))+15)/60)),PX=46,H=(H1-H0)*PX;
 const y=t=>(t-H0*60)/60*PX;
 const blk=(cls,a,b,txt,style,act)=>'<'+(act?'button':'div')+' class="blk '+cls+'" style="top:'+y(a)+'px;height:'+Math.max(18,y(b)-y(a)-2)+'px;'+(style||'')+'"'+(act||'')+'>'+txt+'</'+(act?'button':'div')+'>';
 let head='<div class="wh"></div>',tc='<div class="tcol" style="height:'+H+'px">',cols='';
 for(let h=H0;h<H1;h++){tc+='<span style="top:'+y(h*60)+'px">'+h+'</span>';}
 tc+='</div>';
 days.forEach(d=>{const ds=iso(d),I=dayInfo(d),exs=S.exams.filter(e=>e.date===ds);
  head+='<div class="wh'+(ds===todayIso()?' today':'')+'">'+DN[d.getDay()]+'<br>'+d.getDate()+'.'+(d.getMonth()+1)+'.'+exs.map(e=>'<span class="ex">'+KINDS[e.kind].e+' '+esc(subj(e.subj).n)+'</span>').join('')+'</div>';
  let c='';for(let h=H0;h<H1;h++)c+='<div class="hl" style="top:'+y(h*60)+'px"></div>';
  if(I.school)c+=blk('fx',I.leave,I.end,'🏫 Schule');
  c+=blk('fx',I.lunch[0],I.lunch[1],'🍽️');
  if(I.school&&I.hw[1]>I.hw[0])c+=blk('fx',I.hw[0],I.hw[1],'✏️ Hausaufgaben');
  c+=blk('fx',I.dinner[0],I.dinner[1],'🍝');
  S.hobbies.filter(x=>x.days.includes(d.getDay())).forEach(x=>{c+=blk('hb',m(x.from),m(x.to),x.e+' '+esc(x.n));});
  S.units.filter(u=>u.date===ds).forEach(u=>{const e=S.exams.find(z=>z.id===u.exam);if(!e)return;const s=subj(e.subj);
   c+=blk(u.kind==='review'?'rv':'un',m(u.time),m(u.time)+u.len,(u.kind==='review'?'🔁 ':'📚 ')+esc(s.n)+(u.ok?' ✓':''),'background:'+s.c,' data-act="uedit" data-v="'+u.id+'" aria-label="'+esc(s.n)+' um '+u.time+' ändern"');});
  if(I.bed<H1*60)c+='<div class="bedline" style="top:'+y(I.bed)+'px">🌙 '+hm(I.bed)+'</div>';
  cols+='<div class="dcol" style="height:'+H+'px">'+c+'</div>';});
 const lab=days[0].getDate()+'.'+(days[0].getMonth()+1)+'. – '+days[6].getDate()+'.'+(days[6].getMonth()+1)+'.';
 return '<h1>🗓️ Meine Woche</h1><p class="lead">So sieht deine Woche aus. Tipp auf eine Lernzeit, um sie zu ändern.</p>'
 +'<div class="wknav"><button class="btn small" data-act="wk" data-v="-1" aria-label="Woche davor">◀</button><b>'+(X.wk===0?'Diese Woche':X.wk===1?'Nächste Woche':'Woche')+'<br>'+lab+'</b><button class="btn small" data-act="wk" data-v="1" aria-label="Woche danach">▶</button></div>'
 +'<div class="gridwrap"><div class="wk">'+head+tc+cols+'</div></div>'
 +tip('🦉','Power-Tipp: Ein Blick, und du weißt, was kommt. Das ist Überblick.');
};

 return '<h1>👤 Für Erwachsene</h1><p class="lead">Hier stellen Sie die Lernwerte ein, sichern Daten und helfen beim Kalender-Import.</p>'

 +'<div class="card"><h2>🔄 Neu starten</h2><p>Löscht alle Eingaben auf diesem Gerät.</p><button class="btn" data-act="reset">Alles löschen</button></div>'
 +'<button class="btn go wide" data-act="adultback">◀ Zurück zum Plan</button>';

function overlay(){
 const u=X.edit&&S.units.find(x=>x.id===X.edit);
 if(!u){$('ov').innerHTML='';return;}
 const e=S.exams.find(z=>z.id===u.exam),s=subj(e&&e.subj);
 $('ov').innerHTML='<div class="overlay" data-act="closeov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Lernzeit ändern"><h2>'+s.e+' '+esc(s.n)+'</h2>'+unitRow(u)+'<div class="chips" style="margin-top:16px"><button class="btn go" data-act="closeov">Fertig ✓</button><button class="btn" data-act="udel" data-v="'+u.id+'">🗑️ Löschen</button></div></div></div>';
}
function render(){
 const st=STEPS[S.step]||'start';
 header();$('app').className=st==='woche'?'wide':'';
 $('app').innerHTML=V[st]();overlay();
}
</script>

<script>
/* ── Block 5 · Bedienung ───────────────────────────────────────── */
function setPath(p,v){const parts=p.split('.'),rootName=parts.shift();let o=rootName==='S'?S:X;while(parts.length>1){o=o[parts.shift()];if(!o)return;}o[parts[0]]=v;}
function go(i){X.err='';X.pick=null;X.edit=null;S.step=i;save();render();window.scrollTo(0,0);}
const ACT={
 go:v=>{if(!S.tier)return;go(+v);if(+v===5)maybePlan();},
 back:()=>{if(S.step>0)go(S.step-1);},
 next:()=>{
  if(S.step===0){if(!S.age){X.err='Tipp noch auf dein Alter.';render();return;}go(1);return;}
  if(S.step>=2&&S.step<=7)S.done[S.step]=true;
  const n=S.step+1;go(n);if(n===5)maybePlan();
 },
 age:v=>{S.age=+v;X.err='';save();render();},
 pick:v=>{X.pick=v;render();window.scrollTo(0,0);},
 tierok:()=>{S.tier=X.pick;go(2);},
 tierno:()=>{X.pick=null;render();},
 daytab:v=>{X.dayTab=v;render();},
 hw:v=>{S.day.hw=+v;save();render();},
 newhob:()=>{X.hobby={e:'⚽',n:'',days:[],from:'15:00',to:'16:30'};X.err='';render();},
 hobemo:v=>{X.hobby.e=v;render();},
 hobday:v=>{const d=+v,a=X.hobby.days;X.hobby.days=a.includes(d)?a.filter(x=>x!==d):[...a,d];render();},
 savehob:()=>{const f=X.hobby;if(!f.n.trim()){X.err='Wie heißt dein Hobby?';}else if(!f.days.length){X.err='Tipp mindestens einen Tag an.';}else if(m(f.to)<=m(f.from)){X.err='Das Ende kommt nach dem Anfang.';}
  else{S.hobbies.push({id:uid(),e:f.e,n:f.n.trim(),days:f.days,from:f.from,to:f.to});X.hobby=null;X.err='';S.exams.forEach(e=>{if(!e.planned)return;});save();}render();},
 delhob:v=>{S.hobbies=S.hobbies.filter(x=>x.id!==v);save();render();},
 cancel:()=>{X.hobby=null;X.exam=null;X.subj=null;X.err='';render();},
 newex:()=>{X.exam={kind:'ka',subj:S.subjects[0]&&S.subjects[0].id,date:'',topic:'',level:'mittel'};X.err='';render();},
 exkind:v=>{X.exam.kind=v;render();},
 exsubj:v=>{X.exam.subj=v;render();},
 exlvl:v=>{X.exam.level=v;render();},
 saveex:()=>{const f=X.exam;if(!f.subj){X.err='Wähl noch ein Fach.';}else if(!f.date){X.err='Wann ist die Prüfung? Wähl ein Datum.';}else if(f.date<todayIso()){X.err='Das Datum liegt schon hinter dir.';}
  else{S.exams.push({id:uid(),kind:f.kind,subj:f.subj,date:f.date,topic:f.topic.trim(),level:f.level,planned:false});X.exam=null;X.err='';save();}render();},
 delex:v=>{S.exams=S.exams.filter(e=>e.id!==v);S.units=S.units.filter(u=>u.exam!==v);save();render();},
 newsubj:()=>{X.subj={n:'',e:'🔤',c:COLORS[4]};render();},
 subjemo:v=>{X.subj.e=v;render();},
 subjcol:v=>{X.subj.c=v;render();},
 savesubj:()=>{const g=X.subj;if(!g.n.trim()){X.err='Wie heißt dein Fach?';render();return;}const s={id:uid(),n:g.n.trim(),e:g.e,c:g.c};S.subjects.push(s);X.exam.subj=s.id;X.subj=null;X.err='';save();render();},
 cancelsubj:()=>{X.subj=null;render();},
 delsubj:v=>{S.subjects=S.subjects.filter(s=>s.id!==v);save();render();},
 umove:(v,t)=>{const u=S.units.find(x=>x.id===v);if(u&&moveUnit(u,+t.dataset.k))save();render();},
 uok:v=>{const u=S.units.find(x=>x.id===v);if(u){u.ok=!u.ok;save();render();}},
 allok:()=>{S.units.forEach(u=>u.ok=true);save();render();},
 replan:()=>{planAll(true);render();},
 uedit:v=>{X.edit=v;overlay();},
 udel:v=>{S.units=S.units.filter(u=>u.id!==v);X.edit=null;save();render();},
 closeov:(v,t,e)=>{if(e&&e.target!==t)return;X.edit=null;render();},
 wk:v=>{X.wk+=+v;render();},
 icsopt:v=>{S.ics[v]=!S.ics[v];save();render();},
 ics:()=>{const o=Object.assign({},S.ics);download('mein_lernplan.ics',buildICS(o),'text/calendar;charset=utf-8');S.done[7]=true;X.dl=true;save();render();},
 adult:()=>{if(S.step!==8)S.prev=S.step;go(8);},
 adultback:()=>go(S.prev>=2?S.prev:(S.tier?2:0)),
 ulen:v=>{S.cfg.unitLen=+v;save();render();},
 jsonout:()=>download('powerplan_sicherung.json',JSON.stringify(S,null,1),'application/json'),
 jsonin:()=>$('jsonfile').click(),
 reset:()=>{if(confirm('Wirklich alle Eingaben löschen?')){S=defaults();save();X.err='';go(0);}}
};
function maybePlan(){if(S.exams.some(e=>!e.planned&&e.date>todayIso())){planAll(false);render();}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f)f(t.dataset.v,t,e);});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.bind&&t.type==='text'){setPath(t.dataset.bind,t.value);if(t.dataset.bind.startsWith('S.'))save();if(t.dataset.bind==='S.nick'){const n=document.querySelector('.me .n');if(n)n.textContent=t.value||'Hi!';}}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.bind&&t.type!=='text'){let v=t.value;if(t.type==='number'){v=Math.max(+t.min,Math.min(+t.max,+v||+t.min));t.value=v;}if(t.type==='time'&&!v)return;setPath(t.dataset.bind,v);save();}
 if(t.dataset.utime){const u=S.units.find(x=>x.id===t.dataset.utime);if(u&&t.value){u.time=t.value;u.ok=false;save();render();if(X.edit)overlay();}}
});

const dayInfoV1=dayInfo;
dayInfo=function(d){const I=dayInfoV1(d);if(!I.school)return I;const w=+(S.day.way||0);if(!w)return I;
 I.walkTo=[I.leave,I.leave+w];I.walkBack=[I.end,I.end+w];I.leave=I.leave+w;
 const ls=Math.max(m(S.day.lunch),I.end+w),le=ls+30,he=le+(+S.day.hw||0);I.lunch=[ls,le];I.hw=[le,he];I.from=he+15;return I;};

function freeGaps(d){const I=dayInfo(d),b=busy(d).slice(),end=I.bed-30,out=[];if(I.walkBack)b.push(I.walkBack);
 S.units.forEach(u=>{if(u.date===iso(d))b.push([m(u.time),m(u.time)+u.len+5]);});
 b.sort((x,y)=>x[0]-y[0]);let t=Math.ceil(I.from/5)*5;
 b.forEach(x=>{if(x[1]<=t)return;if(x[0]>t&&x[0]-t>=30&&x[0]<=end)out.push([t,Math.min(x[0],end)]);t=Math.max(t,x[1]);});
 if(end-t>=30)out.push([t,end]);return out.filter(g=>g[1]-g[0]>=30);}
/* Kalenderdatei: alles rein */
const buildICSV1=buildICS;
buildICS=function(o){
 const base=buildICSV1(Object.assign({},o,{school:true,hw:true,hob:true,exams:true,units:true}));
 const now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
 const L=[],TZ=';TZID=Europe/Berlin:',bs=Date.now();let i=0;
 const dt=(d,t)=>iso(d).replace(/-/g,'')+'T'+pad(Math.floor(t/60))+pad(t%60)+'00';
 const start=pd(o.start);
 const first=dows=>{const d=new Date(start);for(let k=0;k<7;k++){if(dows.includes(d.getDay()))return d;d.setDate(d.getDate()+1);}return d;};
 const ev=(sum,d,a,b,rr,desc)=>{if(b<=a)return;L.push('BEGIN:VEVENT','UID:pp-x-'+bs+'-'+(i++)+'@powerplan','DTSTAMP:'+stamp,'DTSTART'+TZ+dt(d,a),'DTEND'+TZ+dt(d,b));if(rr)L.push('RRULE:FREQ=WEEKLY;BYDAY='+rr);L.push('SUMMARY:'+icsEsc(sum));if(desc)L.push('DESCRIPTION:'+icsEsc(desc));L.push('TRANSP:OPAQUE','END:VEVENT');};
 const grp=(days,fn)=>{const g={};days.forEach(w=>{const r=fn(w);if(!r)return;const k=r[0]+'|'+r[1];(g[k]=g[k]||{r,days:[]}).days.push(w);});return Object.values(g);};
 const rr=ds=>ORDER.filter(w=>ds.includes(w)).map(w=>BY[w]).join(',');
 const SCH=[1,2,3,4,5],WE=[6,0];
 const di=w=>dayInfo(first([w]));
 grp(SCH,()=>[m(S.day.wake),m(S.day.wake)+15]).forEach(g=>ev('⏰ Aufstehen',first(g.days),g.r[0],g.r[1],rr(g.days)));
 grp(WE,()=>[m(S.day.weWake),m(S.day.weWake)+15]).forEach(g=>ev('⏰ Aufstehen',first(g.days),g.r[0],g.r[1],rr(g.days)));
 if(+S.day.way){grp(SCH,w=>di(w).walkTo).forEach(g=>ev('🚌 Schulweg',first(g.days),g.r[0],g.r[1],rr(g.days)));
  grp(SCH,w=>di(w).walkBack).forEach(g=>ev('🏠 Heimweg',first(g.days),g.r[0],g.r[1],rr(g.days)));}
 grp(SCH,w=>di(w).lunch).forEach(g=>ev('🍽️ Mittagessen',first(g.days),g.r[0],g.r[1],rr(g.days)));
 grp(WE,w=>di(w).lunch).forEach(g=>ev('🍽️ Mittagessen',first(g.days),g.r[0],g.r[1],rr(g.days)));
 grp(SCH.concat(WE),w=>di(w).dinner).forEach(g=>ev('🍝 Abendessen',first(g.days),g.r[0],g.r[1],rr(g.days)));
 grp(SCH.concat(WE),w=>{const b=di(w).bed;return[b-30,b];}).forEach(g=>ev('🌙 Ruhezeit',first(g.days),g.r[0],g.r[1],rr(g.days),'Zeit zum Runterkommen. Kein Lernen, kein Bildschirm.'));
 const T=todayIso();
 S.units.filter(u=>u.date>=T&&u.kind==='unit').forEach(u=>{const t=m(u.time)+u.len;ev('☕ Pause',pd(u.date),t,t+5,null,'5 Minuten Pause. Aufstehen, trinken, bewegen.');});
 for(let k=0;k<28;k++){const d=addDays(start,k);freeGaps(d).forEach(g=>ev('🎈 Freie Zeit',d,g[0],g[1],null,'Zeit für dich. Spielen, chillen, rausgehen.'));}
 return base.replace(/END:VCALENDAR\r\n$/,L.join('\r\n')+'\r\nEND:VCALENDAR\r\n');
};
/* Station Kalender: Übersicht statt Auswahl */
const PLAN_ITEMS=[['⏰','Aufstehen'],['🚌','Wege'],['🏫','Schule'],['🍽️','Essen'],['✏️','Hausaufgaben'],['⚽','Hobbys'],['📚','Lernzeiten'],['☕','Pausen'],['🎈','Freie Zeit'],['📝','Prüfungen'],['🌙','Ruhezeit']];
const kalV2=V.kal;
V.kal=()=>kalV2().replace(/<div class="field">Was soll rein\?<div class="chips">[\s\S]*?<\/div><\/div>/,
 '<div class="field">Das kommt alles in deinen Plan<div class="planitems">'+PLAN_ITEMS.map(x=>'<span class="pi"><span class="e" aria-hidden="true">'+x[0]+'</span>'+x[1]+'</span>').join('')+'</div></div>'
 +'<p class="tip"><span class="ico" aria-hidden="true">🤝</span><span>Das ist dein erster Entwurf. Im Kalender schiebt ihr zusammen alles so hin, wie es passt.</span></p>');
/* Wochenraster: Wege, Pausen, Freie Zeit, Ruhezeit */
const renderV32=render;
render=function(){

 if(X.landing||X.heroScreen||S.step!==6)return;
 const t0=new Date(),mon=addDays(t0,-((t0.getDay()+6)%7)+7*X.wk),D=S.day,H0=Math.floor(Math.min(m(D.leave),m(D.weWake))/60),PX=46,y=t=>(t-H0*60)/60*PX;
 const blk=(cls,a,b,txt)=>'<div class="blk '+cls+'" style="top:'+y(a)+'px;height:'+Math.max(14,y(b)-y(a)-2)+'px">'+txt+'</div>';

  if(I.walkTo)h+=blk('way',I.walkTo[0],I.walkTo[1],'🚌')+blk('way',I.walkBack[0],I.walkBack[1],'🏠');
  S.units.filter(u=>u.date===iso(d)&&u.kind==='unit').forEach(u=>{const a=m(u.time)+u.len;h+=blk('pause',a,a+5,'');});
  freeGaps(d).forEach(g=>{h+=blk('free',g[0],g[1],'🎈 Frei');});
  h+=blk('ruhe',I.bed-30,I.bed,'🌙');
  col.insertAdjacentHTML('afterbegin',h);});
};

 S.units.filter(u=>u.date===ds).forEach(u=>{const e=S.exams.find(z=>z.id===u.exam);if(!e)return;const s=subj(e.subj),a=m(u.time);

 const h1=I.hw[1];I.hwPause=[h1,h1+PAUSE];['study','dpause','vocab'].forEach(k=>{if(I[k])I[k]=[I[k][0]+PAUSE,I[k][1]+PAUSE];});I.from+=PAUSE;return I;};

 const now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
 const dt=(d,t)=>iso(d).replace(/-/g,'')+'T'+pad(Math.floor(t/60))+pad(t%60)+'00';
 const first=w=>{const d=new Date(start);for(let k=0;k<7;k++){if(d.getDay()===w)return d;d.setDate(d.getDate()+1);}return d;};
 const g={};[1,2,3,4,5].forEach(w=>{const r=dayInfo(first(w)).hwPause;if(!r)return;const k=r.join('|');(g[k]=g[k]||{r,days:[]}).days.push(w);});
 const L=[];let i=0;Object.values(g).forEach(x=>{const d=first(x.days[0]);L.push('BEGIN:VEVENT','UID:pp-hp-'+Date.now()+'-'+(i++)+'@powerplan','DTSTAMP:'+stamp,'DTSTART;TZID=Europe/Berlin:'+dt(d,x.r[0]),'DTEND;TZID=Europe/Berlin:'+dt(d,x.r[1]),'RRULE:FREQ=WEEKLY;BYDAY='+x.days.map(w=>BY[w]).join(','),'SUMMARY:☕ Pause','DESCRIPTION:'+icsEsc(PAUSE+' Minuten Pause nach den Hausaufgaben. Aufstehen, trinken, bewegen.'),'TRANSP:OPAQUE','END:VEVENT');});
 return s.replace(/END:VCALENDAR\r\n$/,(L.length?L.join('\r\n')+'\r\n':'')+'END:VCALENDAR\r\n');};

 W.blocks.forEach(b=>{if(b.cat==='learn'&&b.sub&&b.sub.indexOf('☕')>=0){b.b=b.b-PAUSE;b.sub=hm(b.a)+' · '+(b.b-b.a)+' Min';add.push({a:b.b,b:b.b+PAUSE,cat:'pause',txt:'☕ Pause',bg:CAT.pause.bg,sub:PAUSE+' Min · bewegen, trinken'});}});

 W.blocks.forEach(b=>{if(b.cat==='pause'&&!b.sub)b.sub=PAUSE+' Min · bewegen, trinken';});

 const W=wBlocks(d),out=[];let wakeDone=false;
 W.blocks.forEach(b=>{

  out.push({e:em,n:name,t:hm(b.a)+'–'+hm(b.b),bg,w:1+Math.min(3,dur/90),cat:b.cat});});

<script>
/* ── Block 60 · „Zu viel geplant?“ – Überschneidungen sichtbar machen + Lösungen anbieten (v56) ── */
const wBlocksV59=wBlocks;
wBlocks=function(d){const W=wBlocksV59(d),bl=W.blocks,cf=[];
 bl.forEach(b=>{b.cf=false;if(!b.txt||!/^\S/.test(b.txt))b.txt='• '+(b.txt||'');});
 const real=bl.filter(b=>b.cat!=='free'&&b.cat!=='ruhe');
 for(let i=0;i<real.length;i++)for(let j=i+1;j<real.length;j++){const A=real[i],B=real[j];
  if(Math.min(A.b,B.b)-Math.max(A.a,B.a)>0){A.cf=B.cf=true;cf.push({type:'overlap',A,B});}}
 real.forEach(b=>{if(b.b>W.bed-30&&b.cat!=='ruhe'){b.cf=true;cf.push({type:'late',A:b});}});
 W.conflicts=cf;W.freeMin=bl.filter(b=>b.cat==='free').reduce((s,b)=>s+(b.b-b.a),0);return W;};
const tt=b=>b.txt+' ('+hm(b.a)+'–'+hm(b.b)+')';
function hobOf(b,dow){const name=b.txt.replace(/^\S+\s/,'').replace(/^(Hinweg|Rückweg) · /,'');return S.hobbies.find(h=>!h.way&&h.n===name&&h.days.includes(dow));}
function fixButtons(cf,d){const dow=d.getDay(),seen={},out=[];
 const add=(key,html)=>{if(!seen[key]){seen[key]=1;out.push(html);}};
 cf.forEach(c=>[c.A,c.B].filter(Boolean).forEach(b=>{
  if(b.cat==='hob'||b.cat==='way'){const h=hobOf(b,dow);if(h)add('h'+h.id,'<button class="btn small cfbtn" data-act="cfhob" data-id="'+h.id+'" data-v="'+dow+'">🙅 '+esc(h.n)+' am '+DAYFULL_ALL[dow]+' streichen</button>');}
  if(b.cat==='study')add('st','<button class="btn small cfbtn" data-act="cfshort" data-k="study" data-v="'+dow+'">✂️ Lernen & Üben kürzen</button>');
  if(b.cat==='vocab')add('vo','<button class="btn small cfbtn" data-act="cfshort" data-k="vocab" data-v="'+dow+'">✂️ Vokabeln kürzen</button>');
  if(b.cat==='hw')add('hw','<button class="btn small cfbtn" data-act="cfshort" data-k="hw" data-v="'+dow+'">✂️ Hausaufgaben kürzen</button>');
  if(b.cat==='rest')add('re','<button class="btn small cfbtn" data-act="cfshort" data-k="rest" data-v="'+dow+'">✂️ Durchatmen kürzen</button>');}));
 out.push('<button class="btn small cfbtn" data-act="wfine">✏️ Im Feinschliff ändern</button>');return out.join('');}
function cfBanner(d){const W=wBlocks(d);if(!W.conflicts.length)return '';
 const lines=W.conflicts.slice(0,4).map(c=>c.type==='late'?'<li>🌙 <b>'+esc(tt(c.A))+'</b> geht bis in deine Ruhezeit.</li>':'<li>💥 <b>'+esc(tt(c.A))+'</b> und <b>'+esc(tt(c.B))+'</b> überschneiden sich.</li>').join('');
 return '<div class="cfbanner" role="alert"><p class="cfh">⚠️ Hey, guck mal: Am '+DAYFULL_ALL[d.getDay()]+' passt nicht alles in deinen Tag.</p><ul>'+lines+'</ul><p class="cfq">🤔 Was kannst du kürzen oder ändern?</p><div class="chips">'+fixButtons(W.conflicts,d)+'</div></div>';}
ACT.cfhob=(v,t)=>{const h=S.hobbies.find(x=>x.id===t.dataset.id);if(!h)return;const w=+v,old=h.days.join();
 if(h.days.length<=1){S.hobbies=S.hobbies.filter(x=>!(x.grp===h.grp&&x.days.join()===old));}
 else S.hobbies.forEach(x=>{if(x.grp===h.grp&&x.days.join()===old)x.days=x.days.filter(y=>y!==w);});save();render();};
ACT.cfshort=(v,t)=>{const k=t.dataset.k,D=S.day,w=+v;

 else if(k==='rest'){if(D.restSame)D.rest=Math.max(0,(+D.rest||0)-10);else D.restDay[w]=Math.max(0,(+D.restDay[w]||0)-10);}
 else D[k]=Math.max(0,(+D[k]||0)-10);save();render();};

function weekDays(){const t0=new Date(),mon=addDays(t0,-((t0.getDay()+6)%7)+7*X.wk);return [0,1,2,3,4,5,6].map(k=>addDays(mon,k));}

 if(!bad.length)return '<div class="cfok">✅ Super geplant! In dieser Woche passt alles in deine Tage.</div>';
 return '<div class="cfweek" role="alert">⚠️ An '+(bad.length===1?'einem Tag':bad.length+' Tagen')+' ist zu viel geplant: '+bad.map(d=>'<button class="btn small cfday" data-act="cfgo" data-v="'+((d.getDay()+6)%7)+'">'+DN[d.getDay()]+'</button>').join(' ')+'</div>';}

 }else if(X.wmode==='poster'){const tl=document.querySelector('.wmodes2');if(tl)tl.insertAdjacentHTML('afterend',weekSummary());}

 const H2=H-wayPart;let n=Math.max(1,+S.day.hwParts||1);if(H2<n*10)n=Math.max(1,Math.floor(H2/10));

t?“ – „Was ist dir an dem Tag wichtig?“", "Ask instead of deciding: “What do you think, is there enough time?” – “What matters to you on that day?”"], ["Nur an Tagen mit 🚌 oder 🚆. Wirst du abgeholt 🚗 oder gehst zu Fuß 🚶, bleiben die Aufgaben zu Hause.", "Only on days with 🚌 or 🚆. If you're picked up 🚗 or walk 🚶, the work stays at home."], ["Du hast noch keine Zeit für Vokabeln gewählt. Tipp auf ◀ Zurück, wenn du welche einplanen willst.", "You haven't chosen any vocabulary time yet. Tap ◀ Back if you want to plan some."], ["In dieser Woche gibt es noch keine Lernzeiten. Sie erscheinen, sobald du eine Prüfung einträgst.", "There are no study times this week yet. They appear as soon as you add a test."], ["Wenn du alles geschafft hast, gönnst du dir … Sprich deine Belohnung mit einem Erwachsenen ab. 🤝", "When you've done everything, you treat yourself to … Agree on your reward with an adult. 🤝"], ["Import in Google Kalender über das Konto eines Elternteils oder über Family Link – am Computer.", "Import into Google Calendar via a parent's account or Family Link – on a computer."], ["Das gute Gefühl nach dem Schaffen ist die stärkste Belohnung. Such dir einen Stolz-Moment aus:", "The good feeling after getting things done is the strongest reward. Pick a proud moment:"], ["auf den Schreibtisch. Immer wenn etwas toll lief oder du etwas geschafft hast, legst du eine", "on your desk. Whenever something went well or you got something done, put a"], ["Wie lange brauchst du hin und zurück? Diese Zeit kommt als eigener Block in deinen Kalender.", "How long do you need there and back? This time goes into your calendar as its own block."], ["Alle Daten bleiben im Browser dieses Geräts. Kein Login, keine Cloud. Ein Spitzname reicht.", "All data stays in this device's browser. No login, no cloud. A nickname is enough."], ["💡 Anders gelaufen als geplant? Tipp auf eine Karte und ändere die Uhrzeit – nur für heute.", "💡 Didn't go as planned? Tap a card and change the time – just for today."], ["Tipp auf ❔ und sag, wie sich eine Aufgabe anfühlt: 😄 toll · 😐 geht so · 😣 schwer für mich.", "Tap ❔ and say how a task feels: 😄 great · 😐 okay · 😣 hard for me."], ["Jeden Tag ein paar Vokabeln, auch am Wochenende. Kleine Portionen bleiben besser im Kopf.", "A few words every day, at the weekend too. Small portions stick better."], ["Das ist dein erster Entwurf. Im Kalender schiebt ihr zusammen alles so hin, wie es passt.", "This is your first draft. In the calendar you move everything together until it fits."], ["Ein guter Moment für Stufe 2: wenn dein Kind seinen Plan zwei, drei Wochen gut nutzt.", "A good moment for level 2: when your child has used the plan well for two or three weeks."], ["Das ist dein Vorschlag. Passt eine Zeit? Tipp auf „Passt?“. Sonst schieb sie mit ◀ ▶.", "This is your suggestion. Does a time fit? Tap “Fits?”. Otherwise move it with ◀ ▶."], ["Das erste Anlegen dauert etwa 30–45 Minuten. Danach reichen ein paar Minuten am Tag.", "Setting it up the first time takes about 30–45 minutes. After that a few minutes a day are enough."], ["Die App schlägt dir den Plan vor. Wenn das gut klappt, geht es weiter mit Stufe 2. 🌱", "The app suggests your plan. When that works well, you move on to level 2. 🌱"], ["länger gebraucht als geplant. Das ist ganz normal – plan nächstes Mal mehr Zeit ein.", "longer than planned. That's completely normal – plan more time next time."], ["Datei auswählen, Kalender „Mein alles viiiel leichter Plan“ wählen → „Importieren“.", "Select the file, choose the calendar “My everything-sooo-much-easier plan” → “Import”."], ["Neue Werte gelten beim nächsten „🔄 Neu vorschlagen“. Bestätigte Einheiten bleiben.", "New values apply at the next “🔄 Suggest again”. Confirmed units stay."], ["hast du geschafft, obwohl es dir schwerfällt. Darauf kannst du richtig stolz sein!", "– you did it, even though it's hard for you. You can be really proud of that!"], ["Zum Beispiel zum Bäcker gehen. Tipp an, was du machst. Du kannst mehrere  const isPause=c=>/^(Pause|Bewegungspause)$/.test(c.n)||c.e==='☕'||c.e==='🤸';
 const isLearn=c=>['hw','vocab','study','learn'].includes(c.cat)||/Hausaufgaben|Vokabeln|Lernen & Üben|Einheit|wiederholen/.test(c.n)||(c.e==='📚'&&!c.free);
 C=C.filter(c=>!isPause(c)&&!/^Gute Nacht/.test(c.n));
 const out=[];for(let i=0;i<C.length;i++){const c=C[i],nx=C[i+1];
  if(/^Aufstehen/.test(c.n)&&nx&&(nx.cat==='way'||/^Schulweg/.test(nx.n))){out.push(Object.assign({},c,{e:'⏰',n:'Aufstehen & los',t:(times(c.t)[0]||'')+' · los '+(times(nx.t)[0]||''),w:(c.w||1)+(nx.w||1)}));i++;continue;}

 const start=pd(o.start),now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';

 const first=ws=>{const d=new Date(start);for(let k=0;k<7;k++){if(ws.includes(d.getDay()))return d;d.setDate(d.getDate()+1);}return d;};
 const sum=S.lang==='en'?trEN('🥣 Frühstück'):'🥣 Frühstück';const L=[];
 [[1,2,3,4,5],[6,0]].forEach((ws,i)=>{const d=first(ws),r=bfOf(d);L.push('BEGIN:VEVENT','UID:pp-bf-'+Date.now()+'-'+i+'@powerplan','DTSTAMP:'+stamp,'DTSTART;TZID=Europe/Berlin:'+dt(d,r[0]),'DTEND;TZID=Europe/Berlin:'+dt(d,r[1]),'RRULE:FREQ=WEEKLY;BYDAY='+ORDER.filter(x=>ws.includes(x)).map(x=>BY[x]).join(','),'SUMMARY:'+icsEsc(sum),'TRANSP:OPAQUE','END:VEVENT');});
