<script>
/* ── Block 2 · Lernlogik: freie Zeit finden, Einheiten vorschlagen ── */
function dayInfo(d){
 const dow=d.getDay(),D=S.day;
 if(dow>=1&&dow<=5){const end=m(D.end[dow]),ls=Math.max(m(D.lunch),end),le=ls+30,he=le+(+D.hw||0);
  return{school:true,leave:m(D.leave),end,lunch:[ls,le],hw:[le,he],dinner:[m(D.dinner),m(D.dinner)+30],bed:m(D.bed),from:he+15};}
 return{school:false,lunch:[m(D.weLunch),m(D.weLunch)+45],dinner:[m(D.weDinner),m(D.weDinner)+30],bed:m(D.weBed),from:m(D.weWake)+60};
}
function busy(d,skip){
 const I=dayInfo(d),b=[I.lunch,I.dinner];if(I.school)b.push(I.hw);
 S.hobbies.forEach(h=>{if(h.days.includes(d.getDay()))b.push([m(h.from)-15,m(h.to)+15]);});
 const ds=iso(d);S.units.forEach(u=>{if(u.date===ds&&u.id!==skip)b.push([m(u.time)-5,m(u.time)+u.len+5]);});
 return b;
}
function findSlot(d,len,skip){
 const I=dayInfo(d),b=busy(d,skip),end=I.bed-30;
 for(let t=Math.ceil(I.from/5)*5;t+len<=end;t+=5){if(b.every(x=>t+len<=x[0]||t>=x[1]))return t;}
 return null;
}
function eveBlocked(ds,exId){return S.exams.some(e=>e.id!==exId&&(e.date===ds||iso(addDays(pd(e.date),-1))===ds));}
function planExam(ex){
 S.units=S.units.filter(u=>u.exam!==ex.id||u.ok);
 const c=S.cfg[ex.level],len=unitLen(),E=pd(ex.date),T=pd(todayIso());
 const have=S.units.filter(u=>u.exam===ex.id&&u.kind==='unit').length;
 const days=[];for(let k=c.d;k>=2;k--){const d=addDays(E,-k);if(d>=T&&!eveBlocked(iso(d),ex.id))days.push(d);}
 const need=Math.max(0,c.n-have);let miss=0;
 for(let i=0;i<need;i++){
  if(!days.length){miss++;continue;}
  const pi=Math.min(days.length-1,Math.floor(i*days.length/need)),order=[pi];
  for(let o=1;o<days.length;o++){if(pi+o<days.length)order.push(pi+o);if(pi-o>=0)order.push(pi-o);}
  let placed=false;
  for(const j of order){const d=days[j],ds=iso(d);
   if(S.units.filter(u=>u.date===ds&&u.kind==='unit').length>=S.cfg.maxPerDay)continue;
   const t=findSlot(d,len);if(t!=null){S.units.push({id:uid(),exam:ex.id,kind:'unit',date:ds,time:hm(t),len,ok:false});placed=true;break;}}
  if(!placed)miss++;
 }
 const R=addDays(E,-1);
 if(R>=T&&!S.units.some(u=>u.exam===ex.id&&u.kind==='review')){const t=findSlot(R,S.cfg.review);if(t!=null)S.units.push({id:uid(),exam:ex.id,kind:'review',date:iso(R),time:hm(t),len:S.cfg.review,ok:false});}
 ex.miss=miss;ex.planned=true;
}
function planAll(force){
 const T=todayIso();
 [...S.exams].sort((a,b)=>a.date.localeCompare(b.date)).forEach(ex=>{if(ex.date>T&&(force||!ex.planned))planExam(ex);});
 save();
}
function unitsOf(exId){return S.units.filter(u=>u.exam===exId).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));}
function unitNo(u){return unitsOf(u.exam).filter(x=>x.kind==='unit').indexOf(u)+1;}
function moveUnit(u,k){
 const ex=S.exams.find(e=>e.id===u.exam);let d=addDays(pd(u.date),k);
 if(d<pd(todayIso())||!ex||iso(d)>=ex.date)return false;
 u.date=iso(d);const t=findSlot(d,u.len,u.id);if(t!=null)u.time=hm(t);u.ok=false;return true;
}
</script>

<script>
/* ── Block 3 · Kalenderdatei (.ics) und Sicherung ───────────────── */
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function buildICS(o){
 const now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CMKB//PowerPlan//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(o.name),'X-WR-TIMEZONE:Europe/Berlin',
 'BEGIN:VTIMEZONE','TZID:Europe/Berlin','BEGIN:DAYLIGHT','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','TZNAME:CEST','DTSTART:19700329T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT','BEGIN:STANDARD','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','TZNAME:CET','DTSTART:19701025T030000','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','END:VTIMEZONE'];
 let i=0;const base=Date.now();
 const ev=a=>L.push('BEGIN:VEVENT','UID:pp-'+base+'-'+(i++)+'@powerplan','DTSTAMP:'+stamp,...a,'TRANSP:OPAQUE','END:VEVENT');
 const dt=(d,t)=>iso(d).replace(/-/g,'')+'T'+pad(Math.floor(t/60))+pad(t%60)+'00';
 const TZ=';TZID=Europe/Berlin:';
 const start=pd(o.start);
 const first=dows=>{const d=new Date(start);for(let k=0;k<7;k++){if(dows.includes(d.getDay()))return d;d.setDate(d.getDate()+1);}return d;};
 [1,2,3,4,5].forEach(w=>{const d=first([w]),I=dayInfo(d);
  if(o.school&&I.end>I.leave)ev(['DTSTART'+TZ+dt(d,I.leave),'DTEND'+TZ+dt(d,I.end),'RRULE:FREQ=WEEKLY;BYDAY='+BY[w],'SUMMARY:🏫 Schule']);
  if(o.hw&&I.hw[1]>I.hw[0])ev(['DTSTART'+TZ+dt(d,I.hw[0]),'DTEND'+TZ+dt(d,I.hw[1]),'RRULE:FREQ=WEEKLY;BYDAY='+BY[w],'SUMMARY:✏️ Hausaufgaben','DESCRIPTION:'+icsEsc('Danach 15 Minuten Pause.')]);
 });
 if(o.hob)S.hobbies.forEach(h=>{if(!h.days.length)return;const d=first(h.days);
  ev(['DTSTART'+TZ+dt(d,m(h.from)),'DTEND'+TZ+dt(d,m(h.to)),'RRULE:FREQ=WEEKLY;BYDAY='+ORDER.filter(x=>h.days.includes(x)).map(x=>BY[x]).join(','),'SUMMARY:'+icsEsc(h.e+' '+h.n)]);});
 const T=todayIso();
 if(o.exams)S.exams.filter(e=>e.date>=T).forEach(e=>{const s=subj(e.subj),k=KINDS[e.kind];
  ev(['DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+iso(addDays(pd(e.date),1)).replace(/-/g,''),'SUMMARY:'+icsEsc(k.e+' '+s.n+': '+k.n),'DESCRIPTION:'+icsEsc((e.topic?'Thema: '+e.topic+'. ':'')+'Du schaffst das!')]);});
 if(o.units)S.units.filter(u=>u.date>=T).forEach(u=>{const e=S.exams.find(x=>x.id===u.exam);if(!e)return;const s=subj(e.subj),d=pd(u.date),t=m(u.time);
  const title=u.kind==='review'?'🔁 '+s.n+' kurz wiederholen':'📚 '+unitNo(u)+'. '+s.n+'-Einheit';
  ev(['DTSTART'+TZ+dt(d,t),'DTEND'+TZ+dt(d,t+u.len),'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc((e.topic?'Thema: '+e.topic+'. ':'')+(u.kind==='review'?'Nur kurz drüberschauen. Dann gut schlafen.':'Danach 5 Minuten Pause.'))]);});
 L.push('END:VCALENDAR');
 return L.join('\r\n')+'\r\n';
}
function download(name,text,type){
 const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}
function nextMonday(){const d=new Date();const k=(8-d.getDay())%7;return iso(addDays(d,k===0?0:k));}
</script>

<script>

function setPath(p,v){const parts=p.split('.'),rootName=parts.shift();let o=rootName==='S'?S:X;while(parts.length>1){o=o[parts.shift()];if(!o)return;}o[parts[0]]=v;}
function go(i){X.err='';X.pick=null;X.edit=null;S.step=i;save();render();window.scrollTo(0,0);}
const ACT={
 go:v=>{if(!S.tier)return;go(+v);if(+v===5)maybePlan();},
 back:()=>{if(S.step>0)go(S.step-1);},
 next:()=>{
  if(S.step===0){if(!S.age){X.err='Tipp noch auf dein Alter.';render();return;}go(1);return;}
  if(S.step>=2&&S.step<=7)S.done[S.step]=true;
  const n=S.step+1;go(n);if(n===5)maybePlan();
 },
 age:v=>{S.age=+v;X.err='';save();render();},
 pick:v=>{X.pick=v;render();window.scrollTo(0,0);},
 tierok:()=>{S.tier=X.pick;go(2);},
 tierno:()=>{X.pick=null;render();},
 daytab:v=>{X.dayTab=v;render();},
 hw:v=>{S.day.hw=+v;save();render();},
 newhob:()=>{X.hobby={e:'⚽',n:'',days:[],from:'15:00',to:'16:30'};X.err='';render();},
 hobemo:v=>{X.hobby.e=v;render();},
 hobday:v=>{const d=+v,a=X.hobby.days;X.hobby.days=a.includes(d)?a.filter(x=>x!==d):[...a,d];render();},
 savehob:()=>{const f=X.hobby;if(!f.n.trim()){X.err='Wie heißt dein Hobby?';}else if(!f.days.length){X.err='Tipp mindestens einen Tag an.';}else if(m(f.to)<=m(f.from)){X.err='Das Ende kommt nach dem Anfang.';}
  else{S.hobbies.push({id:uid(),e:f.e,n:f.n.trim(),days:f.days,from:f.from,to:f.to});X.hobby=null;X.err='';S.exams.forEach(e=>{if(!e.planned)return;});save();}render();},
 delhob:v=>{S.hobbies=S.hobbies.filter(x=>x.id!==v);save();render();},
 cancel:()=>{X.hobby=null;X.exam=null;X.subj=null;X.err='';render();},
 newex:()=>{X.exam={kind:'ka',subj:S.subjects[0]&&S.subjects[0].id,date:'',topic:'',level:'mittel'};X.err='';render();},
 exkind:v=>{X.exam.kind=v;render();},
 exsubj:v=>{X.exam.subj=v;render();},
 exlvl:v=>{X.exam.level=v;render();},

  else{S.exams.push({id:uid(),kind:f.kind,subj:f.subj,date:f.date,topic:f.topic.trim(),level:f.level,planned:false});X.exam=null;X.err='';save();}render();},
 delex:v=>{S.exams=S.exams.filter(e=>e.id!==v);S.units=S.units.filter(u=>u.exam!==v);save();render();},
 newsubj:()=>{X.subj={n:'',e:'🔤',c:COLORS[4]};render();},
 subjemo:v=>{X.subj.e=v;render();},
 subjcol:v=>{X.subj.c=v;render();},

 cancelsubj:()=>{X.subj=null;render();},
 delsubj:v=>{S.subjects=S.subjects.filter(s=>s.id!==v);save();render();},
 umove:(v,t)=>{const u=S.units.find(x=>x.id===v);if(u&&moveUnit(u,+t.dataset.k))save();render();},
 uok:v=>{const u=S.units.find(x=>x.id===v);if(u){u.ok=!u.ok;save();render();}},
 allok:()=>{S.units.forEach(u=>u.ok=true);save();render();},
 replan:()=>{planAll(true);render();},
 uedit:v=>{X.edit=v;overlay();},
 udel:v=>{S.units=S.units.filter(u=>u.id!==v);X.edit=null;save();render();},
 closeov:(v,t,e)=>{if(e&&e.target!==t)return;X.edit=null;render();},

 ulen:v=>{S.cfg.unitLen=+v;save();render();},
 jsonout:()=>download('powerplan_sicherung.json',JSON.stringify(S,null,1),'application/json'),

document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.bind&&t.type!=='text'){let v=t.value;if(t.type==='number'){v=Math.max(+t.min,Math.min(+t.max,+v||+t.min));t.value=v;}if(t.type==='time'&&!v)return;setPath(t.dataset.bind,v);save();}

});

<script>

X.fz=null;
const WAYS=[0,10,15,20,30,45];
function fzGroups(){const g={};S.hobbies.forEach(h=>{const k=h.grp||h.id;(g[k]=g[k]||{grp:k,e:h.e,n:h.n,items:[],wayTo:0,wayBack:0});
 if(h.way==='to')g[k].wayTo=m(h.to)-m(h.from);else if(h.way==='back')g[k].wayBack=m(h.to)-m(h.from);else{g[k].e=h.e;g[k].n=h.n;g[k].items.push(h);}});
 return Object.values(g).filter(x=>x.items.length);}
function fzDraftFrom(name,e){
 const g=fzGroups().find(x=>x.n===name);const d={grp:g?g.grp:uid(),e:g?g.e:e,n:name,sessions:{},wayTo:g?g.wayTo:0,wayBack:g?g.wayBack:0};
 if(g)g.items.forEach(h=>h.days.forEach(w=>{d.sessions[w]={from:h.from,to:h.to};}));
 return d;}

 S.hobbies=S.hobbies.filter(h=>(h.grp||h.id)!==d.grp);
 const by={};Object.keys(d.sessions).forEach(w=>{const s=d.sessions[w],k=s.from+'|'+s.to;(by[k]=by[k]||{from:s.from,to:s.to,days:[]}).days.push(+w);});
 Object.values(by).forEach(b=>{
  S.hobbies.push({id:uid(),grp:d.grp,e:d.e,n:d.n,days:b.days,from:b.from,to:b.to});
  if(d.wayTo>0)S.hobbies.push({id:uid(),grp:d.grp,way:'to',e:'🚌',n:'Weg zu '+d.n,days:b.days.slice(),from:hm(m(b.from)-d.wayTo),to:b.from});
  if(d.wayBack>0)S.hobbies.push({id:uid(),grp:d.grp,way:'back',e:'🏠',n:'Heimweg von '+d.n,days:b.days.slice(),from:b.to,to:hm(m(b.to)+d.wayBack)});
 });
 save();
}
function fzStart(){const has=fzGroups().length>0;X.fz={stage:has?'list':'pick',sel:fzGroups().map(g=>g.n),custom:{},queue:[],qi:0,d:null,err:''};}
const fzHead='<h1>⚽ Meine Freizeit</h1>';
V.frei=()=>{
 if(!X.fz)fzStart();const F=X.fz;let h=fzHead;
 if(F.stage==='pick'){
  const all=HOB_LIST.concat(Object.entries(F.custom).map(([n,e])=>[e,n])).concat(fzGroups().filter(g=>!HOB_LIST.some(x=>x[1]===g.n)&&!F.custom[g.n]).map(g=>[g.e,g.n]));
  h+='<p class="lead">Tipp auf alles, was du machst. Du kannst mehrere wählen.</p><div class="hobtiles">'

  +'<button class="hobtile" data-act="fzcustom" style="background:#FFFFFF"><span class="e" aria-hidden="true">➕</span>Etwas anderes</button></div>';
  if(F.addOpen)h+='<div class="card"><label class="field">Was machst du?<input type="text" maxlength="30" data-bind="X.fz.newN" value="'+esc(F.newN||'')+'" placeholder="Pfadfinder"></label><div class="field">Bild<div class="chips">'+HOB_EMO.map(e=>'<button class="chip emo" data-act="fzemo" data-v="'+e+'" aria-pressed="'+pr(F.newE===e)+'">'+e+'</button>').join('')+'</div></div><div class="chips"><button class="btn go small" data-act="fzaddok">Dazu ✓</button><button class="btn small" data-act="fzaddno">Abbrechen</button></div></div>';
 }
 else if(F.stage==='time'){
  const d=F.d,days=Object.keys(d.sessions).map(Number);
  h+='<div class="fzq"><span class="fze" aria-hidden="true">'+d.e+'</span><div><p class="wcount">Hobby '+(F.qi+1)+' von '+F.queue.length+'</p><h2 class="fzt">Wann ist '+esc(d.n)+'?</h2></div></div>'
  +'<div class="field">An welchen Tagen? <span class="note">Du kannst mehrere wählen.</span><div class="chips">'+ORDER.map(w=>'<button class="chip" data-act="fzday" data-v="'+w+'" aria-pressed="'+pr(days.includes(w))+'">'+DN[w]+'</button>').join('')+'</div></div>';
  if(days.length){
   const ds=ORDER.filter(w=>days.includes(w)),f=d.sessions[ds[0]],same=ds.every(w=>d.sessions[w].from===f.from&&d.sessions[w].to===f.to);
   if(ds.length>1)h+='<button class="btn small fzsamebtn" data-act="fzsame" aria-pressed="'+pr(same)+'">'+(same?'✓ Alle Tage gleich':'🔁 Für alle Tage gleich')+'</button>';
   h+='<div class="fzdays">'+ds.map(w=>'<div class="fzday"><span class="dayhd">'+DAYFULL_ALL[w]+'</span><div class="fzft"><span class="ftl">Von</span>'+timeIn('X.fz.d.sessions.'+w+'.from',d.sessions[w].from,DAYFULL_ALL[w]+' von')+'</div><div class="fzft"><span class="ftl">Bis</span>'+timeIn('X.fz.d.sessions.'+w+'.to',d.sessions[w].to,DAYFULL_ALL[w]+' bis')+'</div></div>').join('')+'</div>';
  }
  h+='<div class="card fzway"><h2>🚌 Wegzeiten</h2><p class="note">Wie lange brauchst du hin und zurück? Diese Zeit kommt als eigener Block in deinen Kalender.</p>'
  +'<div class="field">🚌 Hinweg<div class="chips">'+WAYS.map(x=>'<button class="chip" data-act="fzway" data-k="wayTo" data-v="'+x+'" aria-pressed="'+pr(d.wayTo===x)+'">'+(x?x+' Min':'keiner')+'</button>').join('')+'</div></div>'
  +'<div class="field">🏠 Rückweg<div class="chips">'+WAYS.map(x=>'<button class="chip" data-act="fzway" data-k="wayBack" data-v="'+x+'" aria-pressed="'+pr(d.wayBack===x)+'">'+(x?x+' Min':'keiner')+'</button>').join('')+'</div></div></div>';
 }
 else{
  const gs=fzGroups();
  h+='<p class="lead">Das ist deine Freizeit. Diese Zeiten bleiben frei.</p>';
  h+=gs.length?gs.map(g=>'<div class="fzrow"><span class="fze" aria-hidden="true">'+g.e+'</span><div class="fzinfo"><b>'+esc(g.n)+'</b>'+g.items.map(it=>'<span class="fzline">'+ORDER.filter(w=>it.days.includes(w)).map(w=>DN[w]).join(', ')+' · '+it.from+'–'+it.to+'</span>').join('')
   +((g.wayTo||g.wayBack)?'<span class="fzline note">'+(g.wayTo?'🚌 '+g.wayTo+' Min hin':'')+(g.wayTo&&g.wayBack?' · ':'')+(g.wayBack?'🏠 '+g.wayBack+' Min zurück':'')+'</span>':'')+'</div>'
   +'<button class="btn small" data-act="fzedit" data-v="'+esc(g.n)+'">✏️ Ändern</button><button class="del" data-act="fzdel" data-v="'+g.grp+'" aria-label="'+esc(g.n)+' löschen">🗑️</button></div>').join('')
   :'<p class="note">Noch keine Hobbys eingetragen.</p>';
  h+='<button class="btn power wide" data-act="fzmore">➕ Hobbys auswählen</button>';
 }
 if(F.err)h+='<p class="err" role="alert">'+F.err+'</p>';
 return '<div class="fzwrap">'+h+tip('🔋','Power-Tipp: Freizeit lädt deine Superkräfte wieder auf.')+'</div>';
};
const DAYFULL_ALL={1:'Montag',2:'Dienstag',3:'Mittwoch',4:'Donnerstag',5:'Freitag',6:'Samstag',0:'Sonntag'};
ACT.fzsel=(v,t)=>{const F=X.fz,i=F.sel.indexOf(v);if(i>=0)F.sel.splice(i,1);else{F.sel.push(v);if(!HOB_LIST.some(x=>x[1]===v)&&!fzGroups().some(g=>g.n===v))F.custom[v]=t.dataset.e;}F.err='';render();};

 fzGroups().filter(g=>!F.sel.includes(g.n)).forEach(g=>{S.hobbies=S.hobbies.filter(h=>(h.grp||h.id)!==g.grp);});save();
 if(!F.sel.length){F.err='Tipp mindestens ein Hobby an.';render();return;}
 F.queue=F.sel.slice();F.qi=0;F.d=fzDraftFrom(F.queue[0],fzEmoji(F.queue[0]));F.stage='time';F.err='';render();window.scrollTo(0,0);}

 if(days.some(w=>m(d.sessions[w].to)<=m(d.sessions[w].from))){F.err='Das Ende kommt nach dem Anfang. Prüf noch einmal die Zeiten.';render();return;}
 fzSave(d);F.err='';
 if(F.qi<F.queue.length-1){F.qi++;F.d=fzDraftFrom(F.queue[F.qi],fzEmoji(F.queue[F.qi]));}else{F.stage='list';F.d=null;}

 $('nav').innerHTML='<div class="nav"><button class="btn" data-act="fzback">◀ Zurück</button><span class="sp"></span><button class="btn go" data-act="fznext">'+(last?'Weiter ▶':F.stage==='time'&&F.qi===F.queue.length-1?'Fertig ✓':'Weiter ▶')+'</button></div>';
};

 if(F.stage==='time'){if(F.qi>0){F.qi--;F.d=fzDraftFrom(F.queue[F.qi],fzEmoji(F.queue[F.qi]));}else{F.stage='pick';}F.err='';render();window.scrollTo(0,0);}
 else if(F.stage==='pick'&&fzGroups().length){F.stage='list';F.err='';render();}
 else ACT.back();};
render();

<script>

const dayInfoV57=dayInfo;
dayInfo=function(d){const I=dayInfoV57(d);if(!I.school||!(I.study||I.vocab)||!(I.hw[1]>I.hw[0]))return I;
 const h1=I.hw[1];I.hwPause=[h1,h1+PAUSE];['study','dpause','vocab'].forEach(k=>{if(I[k])I[k]=[I[k][0]+PAUSE,I[k][1]+PAUSE];});I.from+=PAUSE;return I;};
const busyV3=busy;

const buildICSV58=buildICS;

 const now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
 const dt=(d,t)=>iso(d).replace(/-/g,'')+'T'+pad(Math.floor(t/60))+pad(t%60)+'00';
 const first=w=>{const d=new Date(start);for(let k=0;k<7;k++){if(d.getDay()===w)return d;d.setDate(d.getDate()+1);}return d;};
 const g={};[1,2,3,4,5].forEach(w=>{const r=dayInfo(first(w)).hwPause;if(!r)return;const k=r.join('|');(g[k]=g[k]||{r,days:[]}).days.push(w);});
 const L=[];let i=0;Object.values(g).forEach(x=>{const d=first(x.days[0]);L.push('BEGIN:VEVENT','UID:pp-hp-'+Date.now()+'-'+(i++)+'@powerplan','DTSTAMP:'+stamp,'DTSTART;TZID=Europe/Berlin:'+dt(d,x.r[0]),'DTEND;TZID=Europe/Berlin:'+dt(d,x.r[1]),'RRULE:FREQ=WEEKLY;BYDAY='+x.days.map(w=>BY[w]).join(','),'SUMMARY:☕ Pause','DESCRIPTION:'+icsEsc(PAUSE+' Minuten Pause nach den Hausaufgaben. Aufstehen, trinken, bewegen.'),'TRANSP:OPAQUE','END:VEVENT');});
 return s.replace(/END:VCALENDAR\r\n$/,(L.length?L.join('\r\n')+'\r\n':'')+'END:VCALENDAR\r\n');};

const pBlocksV58=pBlocks;
pBlocks=function(d){const P=pBlocksV58(d),I=dayInfo(d);if(I.hwPause)P.blocks.push({a:I.hwPause[0],b:I.hwPause[1],cls:'ppause',txt:''});return P;};

 W.blocks.forEach(b=>{if(b.cat==='learn'&&b.sub&&b.sub.indexOf('☕')>=0){b.b=b.b-PAUSE;b.sub=hm(b.a)+' · '+(b.b-b.a)+' Min';add.push({a:b.b,b:b.b+PAUSE,cat:'pause',txt:'☕ Pause',bg:CAT.pause.bg,sub:PAUSE+' Min · bewegen, trinken'});}});

 W.blocks.forEach(b=>{if(b.cat==='pause'&&!b.sub)b.sub=PAUSE+' Min · bewegen, trinken';});

<script>

const wBlocksV59=wBlocks;

 bl.forEach(b=>{b.cf=false;if(!b.txt||!/^\S/.test(b.txt))b.txt='• '+(b.txt||'');});
 const real=bl.filter(b=>b.cat!=='free'&&b.cat!=='ruhe');
 for(let i=0;i<real.length;i++)for(let j=i+1;j<real.length;j++){const A=real[i],B=real[j];
  if(Math.min(A.b,B.b)-Math.max(A.a,B.a)>0){A.cf=B.cf=true;cf.push({type:'overlap',A,B});}}
 real.forEach(b=>{if(b.b>W.bed-30&&b.cat!=='ruhe'){b.cf=true;cf.push({type:'late',A:b});}});
 W.conflicts=cf;W.freeMin=bl.filter(b=>b.cat==='free').reduce((s,b)=>s+(b.b-b.a),0);return W;};

<script>

 const newEnd=parts.length?parts[parts.length-1][1]:hs;let shift=newEnd-oldEnd;

 if(hadPause&&!parts.length){I.hwPause=null;shift-=PAUSE;}else if(I.hwPause)I.hwPause=[newEnd,newEnd+PAUSE];
 ['study','dpause','vocab'].forEach(k=>{if(I[k])I[k]=[I[k][0]+shift,I[k][1]+shift];});I.from+=shift;return I;};

 P.blocks=P.blocks.filter(b=>!(b.cls==='pfx'&&b.txt==='✏️ Hausaufgaben'));const n=I.hwParts.length;
 I.hwParts.forEach((r,k)=>P.blocks.push({a:r[0],b:r[1],cls:'pfx',txt:'✏️ Hausaufgaben'+(n>1?' · Portion '+(k+1)+'/'+n:'')}));
 I.hwInner.forEach(r=>P.blocks.push({a:r[0],b:r[1],cls:'ppause',txt:''}));
 if(I.hwWay)P.blocks.push({a:I.hwWay[0],b:I.hwWay[1],cls:'pfx',txt:'✏️ Hausaufgaben im '+I.hwWayName});return P;};
/* Übersicht: Kategorien, Pausen zwischen Portionen, Konflikte neu (HA im Bus/Zug darf parallel zur Fahrt liegen) */
const wBlocksV60=wBlocks;
wBlocks=function(d){const W=wBlocksV60(d),I=dayInfo(d);
 W.blocks.forEach(b=>{if(/^✏️ Hausaufgaben im /.test(b.txt)){b.cat='hwway';b.bg='#D1C4E9';b.sub=(b.b-b.a)+' Min · parallel zur Fahrt';}});
 (I.hwInner||[]).forEach(r=>{if(!W.blocks.some(b=>b.cat==='pause'&&b.a===r[0]))W.blocks.push({a:r[0],b:r[1],cat:'pause',txt:'☕ Pause',bg:CAT.pause.bg,sub:PAUSE+' Min · bewegen, trinken'});});
 W.blocks.sort((x,y)=>x.a-y.a||(x.cat==='pause'?1:-1));
 const real=W.blocks.filter(b=>b.cat!=='free'&&b.cat!=='ruhe'),cf=[];W.blocks.forEach(b=>b.cf=false);

  if((A.cat==='hwway'&&B.cat==='way')||(A.cat==='way'&&B.cat==='hwway'))continue;

CAT.hwway={bg:'#D1C4E9',n:'Hausaufgaben unterwegs',e:'✏️'};CATSTRIPE.hwway='#5E35B1';PCAT.hwway='#B39DDB';
/* Kalenderdatei: Hausaufgaben als Portionen + unterwegs */
const buildICSV62=buildICS;
buildICS=function(o){let s=buildICSV62(o).replace(/BEGIN:VEVENT\r\n(?:(?!END:VEVENT)[\s\S])*?SUMMARY:✏️ Hausaufgaben\r\n(?:(?!END:VEVENT)[\s\S])*?END:VEVENT\r\n/g,'');
 const start=pd(o.start),now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
 const dt=(d,t)=>iso(d).replace(/-/g,'')+'T'+pad(Math.floor(t/60))+pad(t%60)+'00';
 const first=w=>{const d=new Date(start);for(let k=0;k<7;k++){if(d.getDay()===w)return d;d.setDate(d.getDate()+1);}return d;};
 const g={},put=(sum,r,w,desc)=>{const k=sum+'|'+r.join('|');(g[k]=g[k]||{sum,r,days:[],desc}).days.push(w);};
 [1,2,3,4,5].forEach(w=>{const I=dayInfo(first(w));const n=(I.hwParts||[]).length;
  (I.hwParts||[]).forEach((r,k)=>put('✏️ Hausaufgaben'+(n>1?' · Portion '+(k+1)+'/'+n:''),r,w,n>1?'Danach '+PAUSE+' Minuten Pause.':''));
  (I.hwInner||[]).forEach(r=>put('☕ Pause',r,w,PAUSE+' Minuten Pause zwischen den Hausaufgaben.'));
  if(I.hwWay)put('✏️ Hausaufgaben im '+I.hwWayName,I.hwWay,w,'Ein Teil der Hausaufgaben während der Fahrt.');});
 const L=[];let i=0;Object.values(g).forEach(x=>{const d=first(x.days[0]);L.push('BEGIN:VEVENT','UID:pp-hw-'+Date.now()+'-'+(i++)+'@powerplan','DTSTAMP:'+stamp,'DTSTART;TZID=Europe/Berlin:'+dt(d,x.r[0]),'DTEND;TZID=Europe/Berlin:'+dt(d,x.r[1]),'RRULE:FREQ=WEEKLY;BYDAY='+x.days.map(w=>BY[w]).join(','),'SUMMARY:'+icsEsc(x.sum));if(x.desc)L.push('DESCRIPTION:'+icsEsc(x.desc));L.push('TRANSP:OPAQUE','END:VEVENT');});

/* Wizard-Frage */
if(!TW.some(t=>t.k==='hwsplit')){const hi=TW.findIndex(t=>t.k==='hw');TW.splice(hi+1,0,{k:'hwsplit',e:'✂️',q:'Wie willst du deine Hausaufgaben machen?',we:false});}
function splitPreview(n){const H=+S.day.hw||0,HW=S.day.hwWay,wp=HW.on&&anyRide()?Math.min(+HW.min||0,H):0,H2=H-wp;let k=Math.max(1,n);if(H2<k*10)k=Math.max(1,Math.floor(H2/10));
 if(H2<=0)return 'alles unterwegs';const base=Math.floor(H2/k/5)*5;let rest=H2-base*k;const p=[];for(let i=0;i<k;i++){let L=base+(rest>=5?5:0);if(rest>=5)rest-=5;if(i===k-1)L+=rest;p.push(L);}return p.join(' + ☕ + ')+' Min';}
function hwSplitScreen(i){const D=S.day,n=+D.hwParts||1,HW=D.hwWay;
 let h=wizHead(i,TW[i])+'<div class="splitopts">'+[[1,'🧱','Am Stück'],[2,'✂️','In 2 Portionen'],[3,'✂️','In 3 Portionen']].map(x=>'<button class="splitopt" data-act="hwparts" data-v="'+x[0]+'" aria-pressed="'+pr(n===x[0])+'"><span class="e" aria-hidden="true">'+x[1]+'</span><b>'+x[2]+'</b><span>'+splitPreview(x[0])+'</span></button>').join('')+'</div>';
 if(anyRide()){const dirs=['back','to'].filter(dr=>[1,2,3,4,5].some(w=>rideOK(dr,w)));if(!dirs.includes(HW.dir))HW.dir=dirs[0];
  h+='<div class="rideblock"><label class="switch"><input type="checkbox" data-act2="hwwayon" '+(HW.on?'checked':'')+'><span class="sl" aria-hidden="true"></span><b>🚌 Einen Teil im Bus oder Zug machen</b></label>';

<script>
/* ── Block 68 · Alles pro Wochentag, HA/Lernen weichen dem Sport aus, Prüfungsphase sichtbar + Freizeit vorübergehend aussetzen (v64) ── */
const PDK=['hw','study','vocab'];
if(!S.day.same)S.day.same={hw:true,study:true,vocab:true};
if(!S.day.pd){S.day.pd={};[1,2,3,4,5].forEach(w=>S.day.pd[w]={hw:+S.day.hw||0,study:+S.day.study||0,vocab:+S.day.vocab||0});}
if(!S.skip)S.skip={};

const valOf=(k,w)=>S.day.same[k]?(+S.day[k]||0):(+((S.day.pd[w]||{})[k])||0);
const isSkipped=(ds,h)=>!!(S.skip[ds]&&S.skip[ds].includes(h.grp||h.id));
/* Tagesablauf neu: Durchatmen → HA-Portionen → Pause → Lernen → Pause → Vokabeln, jeweils um Hobbys herum */
const dayInfoV63=dayInfo;
dayInfo=function(d){const I=dayInfoV63(d);if(!I.school)return I;
 const w=d.getDay(),ds=iso(d),P=PAUSE;
 const obst=[I.dinner];S.hobbies.forEach(h=>{if(h.days.includes(w)&&!isSkipped(ds,h))obst.push([m(h.from),m(h.to)]);});
 const free=(a,b)=>obst.every(x=>b<=x[0]||a>=x[1]);
 const place=(t,dur)=>{let s=Math.ceil(t/5)*5;while(s+dur<1435&&!free(s,s+dur))s+=5;return [s,s+dur];};
 let t=I.lunch[1];
 const r=restOf(w);I.rest=null;if(r){I.rest=place(t,r);t=I.rest[1];}
 const H=valOf('hw',w),HW=S.day.hwWay||{},dir=HW.dir;let wayPart=0;I.hwWay=null;
 const way=dir==='back'?I.walkBack:I.walkTo;
 if(HW.on&&way&&rideOK(dir,w)){wayPart=Math.min(+HW.min||0,way[1]-way[0],H);if(wayPart>0){I.hwWay=[way[0],way[0]+wayPart];I.hwWayName=rideName(dir,w);}}
 const H2=H-wayPart;let n=Math.max(1,+S.day.hwParts||1);if(H2<n*10)n=Math.max(1,Math.floor(H2/10));
 const parts=[],inner=[];
 if(H2>0){const base=Math.floor(H2/n/5)*5;let rest=H2-base*n;
  for(let k=0;k<n;k++){let L=base+(rest>=5?5:0);if(rest>=5)rest-=5;if(k===n-1)L+=rest;const seg=place(t,L);parts.push(seg);t=seg[1];
   if(k<n-1&&free(t,t+P)){inner.push([t,t+P]);t+=P;}}}
 I.hwParts=parts;I.hwInner=inner;I.hw=parts.length?[parts[0][0],parts[parts.length-1][1]]:[t,t];
 const L=valOf('study',w),V=valOf('vocab',w);I.hwPause=null;I.study=null;I.dpause=null;I.vocab=null;
 if(parts.length&&(L||V)&&free(t,t+P)){I.hwPause=[t,t+P];t+=P;}
 if(L){I.study=place(t,L);t=I.study[1];}
 if(L&&V&&free(t,t+P)){I.dpause=[t,t+P];t+=P;}
 if(V){I.vocab=place(t,V);t=I.vocab[1];}
 I.from=t+15;return I;};
/* Busy: ausgesetzte Hobbys zählen an diesem Tag nicht */
const busyV4=busy;
busy=function(d,skip){const b=busyV4(d,skip),ds=iso(d),w=d.getDay();
 S.hobbies.forEach(h=>{if(h.days.includes(w)&&isSkipped(ds,h)){const a=m(h.from)-15,e=m(h.to)+15,k=b.findIndex(x=>x[0]===a&&x[1]===e);if(k>=0)b.splice(k,1);}});return b;};
const pBlocksV63=pBlocks;
pBlocks=function(d){const P=pBlocksV63(d),ds=iso(d),w=d.getDay();
 const names=S.hobbies.filter(h=>h.days.includes(w)&&isSkipped(ds,h)).map(h=>h.e+' '+h.n);
 if(names.length)P.blocks=P.blocks.filter(b=>!((b.cls==='phob'||b.cls==='pway')&&names.includes(b.txt)));return P;};
/* Kalenderdatei: ausgesetzte Termine als Ausnahme (EXDATE) */
const buildICSV63=buildICS;

 Object.keys(S.skip).forEach(ds=>{const w=pd(ds).getDay();S.hobbies.filter(h=>h.days.includes(w)&&S.skip[ds].includes(h.grp||h.id)).forEach(h=>{
  const title='SUMMARY:'+icsEsc(unMark(h.e+' '+h.n));const ex='EXDATE;TZID=Europe/Berlin:'+ds.replace(/-/g,'')+'T'+h.from.replace(':','')+'00';
  s=s.replace(/BEGIN:VEVENT\r\n(?:(?!END:VEVENT)[\s\S])*?END:VEVENT\r\n/g,blk=>{if(blk.indexOf(title+'\r\n')<0||blk.indexOf('RRULE')<0||blk.indexOf('T'+h.from.replace(':','')+'00\r\n')<0||blk.indexOf(ex)>=0)return blk;return blk.replace(/(DTSTART[^\r\n]*\r\n)/,'$1'+ex+'\r\n');});});});

er animal → 🌅 My day (fixed times, journeys, homework) → ⚽ Free time → 📝 Subjects and tests → ⚡ Study plan → 🗓️ Fine-tuning and week → 📲 Calendar or print poster → ✅ tick off every day."], ["Dein Kind lernt mit dem PowerPlan Zeitmanagement – Schritt für Schritt: vorausplanen, Aufgaben in Portionen teilen, Pausen ernst nehmen und den Überblick behalten.", "With the PowerPlan your child learns time management – step by step: planning ahead, splitting tasks into portions, taking breaks seriously and keeping an overview."], ["Beim Schätzen & Messen vergleicht dein Kind, wie lange es für Hausaufgaben schätzt und wirklich braucht. So lernt es, seine eigene Zeit realistisch einzuschätzen.", "With estimate & measure your child compares how long it guesses for homework and how long it really takes. That's how it learns to judge its own time realistically."], [". Zum Beispiel: „Du hast heute ganz allein an deine Vokabeln gedacht!“ oder „Du hast trotz Training deine Hausaufgaben geschafft!“ Auch Kleinigkeiten zählen.", ". For example: “Today you remembered your vocabulary all by yourself!” or “You did your homework even though you had training!” Small things count too."], [", zum Beispiel beim Wochenrückblick. Das gibt deinem Kind konkretes Feedback, stärkt eure sichere Bindung – und ist für alle ein sehr schöner Moment. 💛", ", for example during the weekly review. It gives your child concrete feedback, strengthens your secure bond – and is a lovely moment for everyone. 💛"], ["Ohne Handy oder Computer-Kalender? Druck deinen Plan aus und häng ihn auf. Im Druckfenster „Als PDF speichern“ wählen, dann hast du ihn als Datei.", "No phone or computer calendar? Print your plan and hang it up. Choose “Save as PDF” in the print window to get it as a file."], ["Hilf deinem Kind, den Alltag leichter zu gestalten. Hier findest du, worum es geht und wie du begleiten kannst – und darunter die Einstellungen.", "Help your child make everyday life easier. Here you'll find what it's about and how you can support – and the settings below."], ["Lerneinheiten passen nicht mehr in deine Tage vor der Prüfung. Guck dir an, wo es eng wird – und such mit einem Erwachsenen noch Zeit.", "study units don't fit into your days before the test any more. Have a look where it gets tight – and find some time with an adult."], ["Hier siehst du alles, was in deinem Plan steht. Passt eine Zeit noch nicht? Ändere sie hier. Am besten zusammen mit einem Erwachsenen.", "Here you can see everything in your plan. Does a time not fit yet? Change it here. Best together with an adult."], ["Hier siehst du alle Fragen – in der Reihenfolge deines Tages. Jede Frage zählt. Tipp eine Kachel an, um direkt dorthin zu springen.", "Here you can see all questions – in the order of your day. Every question counts. Tap a tile to jump straight there."], ["Lerneinheit passt nicht mehr in deine Tage vor der Prüfung. Guck dir an, wo es eng wird – und such mit einem Erwachsenen noch Zeit.", "study unit doesn't fit into your days before the test any more. Have a look where it gets tight – and find some time with an adult."], ["Ab 13, Stufe 2 (Ausbau): Einheiten steigerbar bis 30 Minuten. Dein Kind verteilt seine Lerneinheiten selbst, die App prüft danach.", "From 13, level 2 (next level): units can grow up to 30 minutes. Your child spreads the study units, the app checks afterwards."], ["Die App zeigt, wenn mehr geplant ist, als in einen Tag passt. Zuerst fragt das Powertier, ob deinem Kind selbst etwas auffällt.", "The app shows when more is planned than fits into a day. First the power animal asks whether your child notices something."], ["Einmal pro Woche, etwa am Sonntag, 5 Minuten gemeinsam: Was lief gut? Was war zu viel? Was ändern wir? Fragen statt bewerten.", "Once a week, e.g. on Sunday, 5 minutes together: what went well? What was too much? What do we change? Ask, don't judge."], ["✍️ Stufe 2: Du verteilst deine Lerneinheiten selbst. Tipp für jede Einheit auf einen Tag – danach prüft die App gain. 💪"], ["Fang selbst ein Glas an. Wenn dir auffällt, was dein Kind geschafft hat, schreib einen kleinen Zettel –", "Start a jar yourself. When you notice something your child has done, write a little note –"], ["Stell dir ein echtes Glas hin. Immer wenn etwas toll lief oder du etwas geschafft hast, legst du eine", "Put a real jar on your desk. Whenever something went well or you got something done, put a"], ["In Prüfungsphasen ist es normal, Freizeit für ein paar Tage zu kürzen. Danach ist wieder mehr Platz.", "During test phases it's normal to cut free time for a few days. Afterwards there's more room again."], ["Hilf beim Abwägen: Was ist fest, zum Beispiel das Training? Was lässt sich kürzen oder verschieben?", "Help weigh it up: what is fixed, for example training? What can be shortened or moved?"], ["Frag nach, statt vorzugeben: „Was meinst du, reicht die Zeit?“ – „Was ist dir an dem Tag wichtig?“", "Ask instead of deciding: “What do you think, is there enough time?” – “What matters to you on that day?”"], ["In dieser Woche gibt es noch keine Lernzeiten. Sie erscheinen, sobald du eine Prüfung einträgst.", "There are no study times this week yet. They appear as soon as you add a test."], ["Wenn du alles geschafft hast, gönnst du dir … Sprich deine Belohnung mit einem Erwachsenen ab. 🤝", "When you've done everything, you treat yourself to … Agree on your reward with an adult. 🤝"], ["Import in Google Kalender über das Konto eines Elternteils oder über Family Link – am Computer.", "Import into Google Calendar via a parent's account or Family Link – on a computer."], ["Das gute Gefühl nach dem Schaffen ist die stärkste Belohnung. Such dir einen Stolz-Moment aus:", "The good feeling after getting things done is the strongest reward. Pick a proud moment:"], ["Wie lange brauchst du hin und zurück? Diese Zeit kommt als eigener Block in deinen Kalender.", "How long do you need there and back? This time goes into your calendar as its own block."], ["Alle Daten bleiben function vocSplit(V,n){if(V<n*5)n=Math.max(1,Math.floor(V/5));const base=Math.floor(V/n/5)*5;let rest=V-base*n;const p=[];for(let k=0;k<n;k++){let L=base+(rest>=5?5:0);if(rest>=5)rest-=5;if(k===n-1)L+=rest;p.push(L);}return p;}
const dayInfoV82=dayInfo;
dayInfo=function(d){const I=dayInfoV82(d);if(!I.vocab)return I;
 const V=I.vocab[1]-I.vocab[0],n=Math.max(1,+S.day.vocabParts||1),VW=S.day.vocabWay||{},w=d.getDay(),ds=iso(d);
 const ride=I.school&&VW.on&&(VW.dir==='back'?I.walkBack:I.walkTo)&&rideOK(VW.dir,w)?(VW.dir==='back'?I.walkBack:I.walkTo):null;
 const want=n+(ride?0:0);const parts=vocSplit(V,ride?Math.max(n,2):n);if(parts.length<2&&!ride){return I;}
 const obst=[I.lunch,I.dinner];S.hobbies.forEach(h=>{if(h.days.includes(w)&&!isSkipped(ds,h))obst.push([m(h.from),m(h.to)]);});evOn(ds).forEach(e=>obst.push([m(e.from)-10,m(e.to)+10]));
 ['rest','hw','study','vocab'].forEach(k=>{if(I[k])obst.push(I[k]);});(I.hwParts||[]).forEach(r=>obst.push(r));
 const free=(a,b)=>obst.every(x=>b<=x[0]||a>=x[1]);
 const extra=[];let idx=0;
 if(ride){const L=Math.min(parts[0],ride[1]-ride[0]);extra.push({r:[ride[0],ride[0]+L],ride:true,name:rideName(VW.dir,w)});idx=1;}
 const chainL=parts[idx]||0;I.vocab=chainL?[I.vocab[0],I.vocab[0]+chainL]:null;if(!chainL)I.dpause=null;idx++;
 const slots=[];let t=I.dinner[1]+5;while(t+5<=I.bed-30){slots.push(t);t+=5;}
 const morning=[];const wk=I.school?m(S.day.wake):m(S.day.weWake),bf=wk+15+BREAKFAST,mEnd=I.school?m(S.day.leave):bf+180;for(let s=bf;s+5<=mEnd;s+=5)morning.push(s);
 const midday=[];for(let s=I.lunch[1]+5;s+5<=I.dinner[0];s+=5)midday.push(s);
 const vpos=[];if(I.vocab)vpos.push(I.vocab[0]);extra.forEach(x=>vpos.push(x.r[0]));
 const placeAt=(cands,L)=>{for(const s of cands){if(free(s,s+L)&&vpos.every(p=>Math.abs(p-s)>=60)){obst.push([s,s+L]);vpos.push(s);return [s,s+L];}}return null;};
 const order=[slots,morning,midday];
 for(let j=0;idx<parts.length;idx++,j++){const L=parts[idx];const r=placeAt(order[j%order.length],L)||placeAt(slots,L)||placeAt(morning,L)||placeAt(midday,L);if(r)extra.push({r});}
 I.vocExtra=extra;I.vocTotalParts=(I.vocab?1:0)+extra.length;return I;};
const busyV6=busy;
busy=function(d,skip){const b=busyV6(d,skip),I=dayInfo(d);(I.vocExtra||[]).forEach(x=>{if(!x.ride)b.push(x.r);});return b;};
const pBlocksV80=pBlocks;
pBlocks=function(d){const P=pBlocksV80(d),I=dayInfo(d);if(!I.vocExtra||!I.vocExtra.length)return P;const N=I.vocTotalParts;
 const all=[];if(I.vocab)all.push({r:I.vocab,chain:true});I.vocExtra.forEach(x=>all.push(x));all.sort((a,b)=>a.r[0]-b.r[0]);
 all.forEach((x,i)=>{const lab=' · Portion '+(i+1)+'/'+N;if(x.chain){P.blocks.forEach(b=>{if(b.cls==='pvocab'&&b.a===x.r[0])b.txt='🔤 Vokabeln'+lab;});}
  else P.blocks.push({a:x.r[0],b:x.r[1],cls:x.ride?'pfx':'pvocab',txt:x.ride?'🔤 Vokabeln im '+x.name+lab:'🔤 Vokabeln'+lab,bg:CAT.vocab.bg});});return P;};
const wBlocksV67=wBlocks;
wBlocks=function(d){const W=wBlocksV67(d);let ch=false;
 W.blocks.forEach(b=>{if(/^🔤 Vokabeln im /.test(b.txt)){b.cat='hwway';b.bg=CAT.vocab.bg;b.sub=(b.b-b.a)+' Min · während der Fahrt';ch=true;}else if(/^🔤 Vokabeln/.test(b.txt)&&b.cat!=='vocab'){b.cat='vocab';b.bg=CAT.vocab.bg;ch=true;}});
 if(ch){const real=W.blocks.filter(b=>b.cat!=='free'&&b.cat!=='ruhe'),cf=[];W.blocks.forEach(b=>b.cf=false);
  for(let i=0;i<real.length;i++)for(let j=i+1;j<real.length;j++){const A=real[i],B=real[j];if((A.cat==='hwway'&&B.cat==='way')||(A.cat==='way'&&B.cat==='hwway')||(A.cat==='hwway'&&B.cat==='hwway'))continue;if(Math.min(A.b,B.b)-Math.max(A.a,B.a)>0){A.cf=B.cf=true;cf.push({type:'overlap',A,B});}}
  real.forEach(b=>{if(b.b>W.bed-30){b.cf=true;cf.push({type:'late',A:b});}});W.conflicts=cf;}
 return W;};
const buildICSV83=buildICS;
buildICS=function(o){let s=buildICSV83(o);const start=pd(o.start);
 const now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
 const dt=(d,t)=>iso(d).replace(/-/g,'')+'T'+pad(Math.floor(t/60))+pad(t%60)+'00';
 const first=w=>{const d=new Date(start);for(let k=0;k<7;k++){if(d.getDay()===w)return d;d.setDate(d.getDate()+1);}return d;};
 const g={};[1,2,3,4,5,6,0].forEach(w=>{const I=dayInfo(first(w));(I.vocExtra||[]).forEach(x=>{const sum=x.ride?'🔤 Vokabeln im '+x.name:'🔤 Vokabeln';const k=sum+'|'+x.r.join('|');(g[k]=g[k]||{sum,r:x.r,days:[]}).days.push(w);});});
 const L=[];let i=0;Object.values(g).forEach(x=>{const d=first(x.days[0]);L.push('BEGIN:VEVENT','UID:pp-vx-'+Date.now()+'-'+(i++)+'@powerplan','DTSTAMP:'+stamp,'DTSTART;TZID=Europe/Berlin:'+dt(d,x.r[0]),'DTEND;TZID=Europe/Berlin:'+dt(d,x.r[1]),'RRULE:FREQ=WEEKLY;BYDAY='+ORDER.filter(w=>x.days.includes(w)).map(w=>BY[w]).join(','),'SUMMARY:'+icsEsc(x.sum),'DESCRIPTION:'+icsEsc('Kurze Vokabel-Portion – öfter kurz bleibt besser im Kopf.'),'TRANSP:OPAQUE','END:VEVENT');});
 if(S.lang==='en')L.forEach((l,j)=>{if(/^(SUMMARY|DESCRIPTION):/.test(l))L[j]=l.split(':')[0]+':'+trEN(l.slice(l.indexOf(':')+1));});
 return s.replace(/END:VCALENDAR\r\n$/,(L.length?L.join('\r\n')+'\r\n':'')+'END:VCALENDAR\r\n');};
/* Wizard: Einteilen auf dem Vokabel-Bildschirm */
const tagV84=V.tag;
V.tag=()=>{let h=tagV84();const i=Math.max(0,Math.min(TW.length-1,X.tw));if(X.twOv||TW[i].k!=='vocab')return h;
 const D=S.day,V=+D.vocab||0,n=+D.vocabParts||1,VW=D.vocabWay;
 const prev=k=>{if((V||10)<k*5)return 'ab '+(k*5)+' Min möglich';const p=vocSplit(V||10,k);return p.join(' + ')+' Min';};
 const when={1:'am Nachmittag',2:'nachmittags + abends',3:'nachmittags, morgens + abends'};
 let sec='<div class="vocsplit"><p class="vsh">✂️ Wie willst du deine Vokabeln einteilen?</p><div class="splitopts">'+[[1,'🧱','Am Stück'],[2,'✂️','In 2 Portionen'],[3,'✂️','In 3 Portionen']].map(x=>'<button class="splitopt" data-act="vocparts" data-v="'+x[0]+'" aria-pressed="'+pr(n===x[0])+'"><span class="e" aria-hidden="true">'+x[1]+'</span><b>'+x[2]+'</b><span>'+prev(x[0])+'</span><span>'+when[x[0]]+'</span></button>').join('')+'</div>';
 if(anyRide()){const dirs=['to','back'].filter(dr=>[1,2,3,4,5].some(w=>rideOK(dr,w)));if(!dirs.includes(VW.dir))VW.dir=dirs[0];
  sec+='<div class="rideblock"><label class="switch"><input type="checkbox" data-act2="vocwayon" '+(VW.on?'checked':'')+'><span class="sl" aria-hidden="true"></span><b>🚌 Eine Portion im Bus oder Zug lernen</b></label>'
   +(VW.on?'<div class="chips">'+dirs.map(dr=>'<button class="chip" data-act="vocwaydir" data-v="'+dr+'" aria-pressed="'+pr(VW.dir===dr)+'">'+(dr==='back'?'🏠 auf dem Heimweg':'🎒 auf dem Schulweg')+'</button>').join('')+'</div>':'')+'</div>';}
 sec+='<p class="note" style="margin-top:8px">Öfter kurz statt einmal lang: So bleiben Vokabeln besser im Kopf. '+whyBtn('portion')+'</p></div>';
 const k=h.lastIndexOf('</div>');return h.slice(0,k)+sec+h.slice(k);};
const renderV85=render;render=function(){renderV85();document.body.classList.toggle('stwiz',!X.landing&&S.step===2);};
ACT.vocparts=v=>{S.day.vocabParts=+v;save();render();};
ACT.vocwaydir=v=>{S.day.vocabWay.dir=v;save();render();};
document.addEventListener('change',e=>{const c=e.target;if(!c.dataset||c.dataset.act2!=='vocwayon')return;S.day.vocabWay.on=c.checked;save();render();});
render();
</script>


<script>
/* ── Block 88 · Vokabeln pro Fach (Englisch, Französisch …) (v86) ── */
const LANGS=[['Englisch','🇬🇧','#1E88E5'],['Französisch','🇫🇷','#3949AB'],['Spanisch','🇪🇸','#E53935'],['Latein','🏛️','#8D6E63'],['Italienisch','🇮🇹','#43A047'],['Russisch','🇷🇺','#546E7A'],['Griechisch','🏺','#FB8C00'],['Chinesisch','🇨🇳','#EC407A']];
const isLang=s=>LANGS.some(l=>l[0].toLowerCase()===s.n.replace(/\u00AD/g,'').toLowerCase());
if(!S.day.vocSubj){const en=S.subjects.find(s=>s.n==='Englisch');S.day.vocSubj=en?[en.id]:[];}
save();
const vocLangs=()=>S.day.vocSubj.map(id=>S.subjects.find(s=>s.id===id)).filter(Boolean);
const wBlocksV87=wBlocks;
wBlocks=function(d){const W=wBlocksV87(d),L=vocLangs();if(!L.length)return W;
 let vb=W.blocks.filter(b=>/^🔤 Vokabeln/.test(b.txt)).sort((a,b)=>a.a-b.a);if(!vb.length)return W;
 while(vb.length<L.length){const big=vb.reduce((x,y)=>(y.b-y.a)>(x.b-x.a)?y:x);const len=big.b-big.a;if(len<10)break;const half=Math.round(len/2/5)*5;
  const nb=Object.assign({},big,{a:big.a+half});big.b=big.a+half;W.blocks.push(nb);vb=W.blocks.filter(b=>/^🔤 Vokabeln/.test(b.txt)).sort((a,b)=>a.a-b.a);}
 vb.forEach((b,i)=>{const s=L[i%L.length],ride=(b.txt.match(/ im (Bus|Zug)/)||[''])[0];const nm=s.n.replace(/\u00AD/g,'');
  b.txt='🔤 '+nm+'-Vokabeln'+ride;b.lang=s.id;b.sub=(b.b-b.a)+' Min'+(ride?' · während der Fahrt':'');});
 W.blocks.sort((x,y)=>x.a-y.a);return W;};
/* Kalenderdatei: Vokabel-Termine je Sprache neu aufbauen */
const buildICSV87=buildICS;
buildICS=function(o){if(!vocLangs().length)return buildICSV87(o);
 let s=buildICSV87(o).replace(/BEGIN:VEVENT\r\n(?:(?!END:VEVENT)[\s\S])*?SUMMARY:🔤 (?:Vokabeln|Vocabulary)[^\r\n]*\r\n(?:(?!END:VEVENT)[\s\S])*?END:VEVENT\r\n/g,'');
 const start=pd(o.start),now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';
 const dt=(d,t)=>iso(d).replace(/-/g,'')+'T'+pad(Math.floor(t/60))+pad(t%60)+'00';
 const first=w=>{const d=new Date(start);for(let k=0;k<7;k++){if(d.getDay()===w)return d;d.setDate(d.getDate()+1);}return d;};
 const g={};[1,2,3,4,5,6,0].forEach(w=>{wBlocks(first(w)).blocks.filter(b=>/^🔤 /.test(b.txt)&&/Vokabeln/.test(b.txt)).forEach(b=>{const k=b.txt+'|'+b.a+'|'+b.b;(g[k]=g[k]||{sum:b.txt,a:b.a,b:b.b,days:[]}).days.push(w);});});
 const L=[];let i=0;Object.values(g).forEach(x=>{const d=first(x.days[0]);L.push('BEGIN:VEVENT','UID:pp-vl-'+Date.now()+'-'+(i++)+'@powerplan','DTSTAMP:'+stamp,'DTSTART;TZID=Europe/Berlin:'+dt(d,x.a),'DTEND;TZID=Europe/Berlin:'+dt(d,x.b),'RRULE:FREQ=WEEKLY;BYDAY='+ORDER.filter(w=>x.days.includes(w)).map(w=>BY[w]).join(','),'SUMMARY:'+icsEsc(S.lang==='en'?trEN(x.sum):x.sum),'TRANSP:OPAQUE','END:VEVENT');});
 return s.replace(/END:VCALENDAR\r\n$/,(L.length?L.join('\r\n')+'\r\n':'')+'END:VCALENDAR\r\n');};
/* Wizard: Sprachen wählen */
const tagV85=V.tag;
V.tag=()=>{let h=tagV85();const i=Math.max(0,Math.min(TW.length-1,X.tw));if(X.twOv||TW[i].k!=='vocab')return h;
 const sel=S.day.vocSubj,have=S.subjects.filter(isLang),missing=LANGS.filter(l=>!S.subjects.some(s=>s.n.replace(/\u00AD/g,'').toLowerCase()===l[0].toLowerCase()));
 const sec='<div class="voclang"><p class="vsh">🌍 Für welche Sprachen lernst du Vokabeln?</p><div class="chips">'
  +have.map(s=>'<button class="chip" data-act="voclang" data-v="'+s.id+'" aria-pressed="'+pr(sel.includes(s.id))+'">'+s.e+' '+esc(s.n.replace(/\u00AD/g,''))+'</button>').join('')
  +missing.filter(l=>X.langMore||['Französisch','Latein','Spanisch'].includes(l[0])).map(l=>'<button class="chip addlang" data-act="vocaddlang" data-v="'+l[0]+'">➕ '+l[1]+' '+l[0]+'</button>').join('')
  +(!X.langMore&&missing.some(l=>!['Französisch','Latein','Spanisch'].includes(l[0]))?'<button class="chip addlang" data-act="langmore">➕ Weitere Sprache</button>':'')+'</div>'
  +(sel.length>1?'<p class="note" style="margin-top:6px">Jede Sprache bekommt ihre eigene Portion – im Wechsel über den Tag.</p>':'')+'</div>';
 const k=h.lastIndexOf('</div>');return h.slice(0,k)+sec+h.slice(k);};
ACT.voclang=v=>{const a=S.day.vocSubj,i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);save();render();};
ACT.langmore=()=>{X.langMore=true;render();};
ACT.vocaddlang=v=>{X.langMore=false;const l=LANGS.find(x=>x[0]===v);if(!l)return;const s={id:uid(),n:l[0],e:l[1],c:l[2]};S.subjects.push(s);S.day.vocSubj.push(s.id);save();render();};
render();
</script>
